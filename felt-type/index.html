<title>Felt Type</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one passage set large on a bare sheet; quiet mono chrome pinned to the edges */
:root {
  --paper: #ffffff;
  --ink: #0b0b0c;
  --mute: #75747a;
  --faint: #dcdbe0;
  --panel: #ffffff;
  --display: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d0d0e; --ink: #f0efeb; --mute: #918f96; --faint: #2b2a2e; --panel: #141416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d0d0e; --ink: #f0efeb; --mute: #918f96; --faint: #2b2a2e; --panel: #141416;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 13px/1.5 var(--mono);
}
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
}
button:focus-visible, .w:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--ink); outline-offset: 3px;
}

.app {
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  overflow-x: clip;
}

/* chrome */
.bar, .foot {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
  gap: 12px 24px;
}
.mark { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
.mark span { display: inline-block; }
.mark span:nth-child(n+6) { font-weight: 300; transform: translateY(0.12em) rotate(6deg); }
.modes { display: flex; gap: 18px; }
.tab { color: var(--mute); text-transform: lowercase; }
.tab[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.tab:hover { color: var(--ink); }

.foot { align-items: center; }
.cite { color: var(--mute); max-width: 60ch; }
.cite em { font-style: normal; color: var(--ink); }
.ctrl { display: flex; align-items: center; gap: 16px; }
.ctrl .count { font-variant-numeric: tabular-nums; color: var(--mute); min-width: 5ch; text-align: center; }
.ctrl button { padding: 6px 2px; }
.ctrl button:hover, .sheet button:hover { text-decoration: underline; text-underline-offset: 4px; }
.arrow { font-size: 16px; }

/* the sheet of type */
.stage {
  display: flex; flex-direction: column; justify-content: center;
  padding-block: clamp(40px, 9vh, 120px);
  min-width: 0;
}
.piece {
  font-family: var(--display);
  font-size: clamp(24px, 3.5vw, 46px);
  line-height: 1.6;
  letter-spacing: -0.012em;
  font-weight: 400;
  max-width: 21em;
  min-width: 0;
}
.hint { margin-top: 2.2em; color: var(--mute); }

.w { cursor: pointer; border-radius: 2px; }
.w:hover .fx:not([data-fx]) { text-decoration: underline dotted var(--mute); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
.w.sel { outline: 1px dashed var(--mute); outline-offset: 0.12em; }

.fx { display: inline-block; position: relative; white-space: nowrap; isolation: isolate; }
.l { display: inline-block; white-space: pre; transform-origin: 50% 70%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.hollow { color: transparent; -webkit-text-stroke: max(1px, 0.024em) var(--ink); font-weight: 700; }
.dark { background: var(--ink); color: var(--paper); padding: 0 0.2em 0.04em; font-weight: 800; }
.stack { display: inline-flex; flex-direction: column; align-items: center; vertical-align: text-top; line-height: 0.8; }
.knock { position: relative; z-index: 1; -webkit-text-stroke: 0.09em var(--paper); paint-order: stroke fill; }
.echo {
  position: absolute; left: 0; top: 0; z-index: -1; white-space: pre; pointer-events: none;
  color: transparent; -webkit-text-stroke: max(1px, 0.02em) var(--ink);
}
.ray { position: absolute; bottom: calc(100% + 0.08em); width: max(1px, 0.03em); background: var(--ink); transform-origin: 50% 100%; }

/* motion: static resting pose first, movement only when allowed */
.anim .l { transform: var(--ts, var(--t0)); }
@keyframes swing { from { transform: var(--t0); } to { transform: var(--t1); } }
@keyframes breathe { from { transform: scale(1); } to { transform: scale(var(--s, 1.12)); } }
@keyframes flicker { 0%, 40%, 44%, 69%, 74%, 100% { opacity: 1; } 42% { opacity: 0.12; } 71% { opacity: 0.3; } }
@keyframes drip {
  0%, 55% { transform: none; opacity: 1; }
  80% { transform: translateY(var(--y, 0.5em)); opacity: 0; }
  81% { transform: translateY(-0.3em); opacity: 0; }
  100% { transform: none; opacity: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .anim .l { animation: swing var(--d, 1s) var(--ease, ease-in-out) var(--dl, 0s) infinite alternate; }
  .breathe { animation: breathe 2.6s ease-in-out infinite alternate; }
  .flick .l { animation: flicker var(--d, 2s) linear var(--dl, 0s) infinite; }
  .drip .l { animation: drip var(--d, 3s) ease-in var(--dl, 0s) infinite; }
}

/* writing your own */
.writer { display: grid; gap: 14px; align-content: center; max-width: 46rem; padding-block: 40px; }
.writer label { color: var(--mute); }
.writer textarea {
  width: 100%; min-height: 14em; resize: vertical;
  font: 400 clamp(17px, 2vw, 21px)/1.5 var(--display);
  color: var(--ink); background: var(--paper);
  border: 1px solid var(--faint); border-radius: 2px; padding: 14px 16px;
}
.writer .row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); padding: 8px 16px; border-radius: 2px; }
.btn.solid { background: var(--ink); color: var(--paper); }

/* effect picker */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--panel);
  border-top: 1px solid var(--ink);
  max-height: 58vh; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 14px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
}
.sheet-head { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: baseline; margin-bottom: 14px; }
.sheet-word { font: 700 20px var(--display); margin-right: auto; }
.lvl { display: flex; gap: 6px; align-items: baseline; color: var(--mute); }
.lvl button { width: 26px; height: 26px; border: 1px solid var(--faint); border-radius: 2px; color: var(--ink); }
.lvl button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.chip {
  display: grid; grid-template-rows: 1fr auto; place-items: center;
  height: 104px; overflow: hidden;
  border: 1px solid var(--faint); border-radius: 2px; padding: 6px 4px;
}
.chip:hover { border-color: var(--mute); }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chip-prev { font: 400 21px/1.3 var(--display); max-width: 100%; overflow: hidden; padding-top: 6px; }
.chip-name { color: var(--mute); font-size: 11px; }
</style>

<div class="app">
  <header class="bar">
    <div class="mark" aria-label="Felt Type"><span>F</span><span>e</span><span>l</span><span>t</span><span>&nbsp;</span><span>t</span><span>y</span><span>p</span><span>e</span></div>
    <nav class="modes" aria-label="Mode">
      <button class="tab" id="tab-read" aria-pressed="true">passages</button>
      <button class="tab" id="tab-mine" aria-pressed="false">your text</button>
      <button class="tab" id="tab-plain" aria-pressed="false">plain</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <div class="piece" id="piece" aria-live="polite"></div>
    <p class="hint">Click any word to choose how it feels.</p>
  </main>

  <section class="writer" id="writer" hidden>
    <label for="src">Paste an excerpt or write a few lines. Words that carry a feeling get a first suggestion, which you can change.</label>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn solid" id="compose">Set the type</button>
      <button id="cancel" class="tab">back to passages</button>
    </div>
  </section>

  <footer class="foot" id="foot">
    <div class="cite" id="cite"></div>
    <div class="ctrl">
      <button id="prev" class="arrow" aria-label="Previous passage">←</button>
      <span class="count" id="count"></span>
      <button id="next" class="arrow" aria-label="Next passage">→</button>
      <button id="shuffle">shuffle</button>
      <button id="edit" hidden>edit text</button>
    </div>
  </footer>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-label="Choose an effect">
  <div class="sheet-head">
    <span class="sheet-word" id="sheet-word"></span>
    <span class="lvl" id="lvl">strength
      <button data-n="1" aria-pressed="false">1</button>
      <button data-n="2" aria-pressed="true">2</button>
      <button data-n="3" aria-pressed="false">3</button>
    </span>
    <button id="sheet-close">close</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<script>
// Passages are public domain. {word|effect|strength} marks a word; \n breaks a line.
const PASSAGES = [
  { id: 'alice', book: 'Alice’s Adventures in Wonderland', author: 'Lewis Carroll', year: 1865,
    text: '{Down|fall|1}, {down|fall|2}, {down|fall|3}. Would the {fall|stack|2} never come to an {end|isolate|2}? “I wonder how many miles I’ve {fallen|fall|1} by this time?” she said aloud.' },
  { id: 'two-cities', book: 'A Tale of Two Cities', author: 'Charles Dickens', year: 1859,
    text: 'It was the {best|rise|2} of times, it was the {worst|sink|2} of times, it was the age of wisdom, it was the age of {foolishness|scatter|1}, it was the epoch of belief, it was the epoch of incredulity, it was the season of {Light|radiate|2}, it was the season of {Darkness|dark|2}, it was the spring of {hope|rise|1}, it was the winter of {despair|sink|3}, we had {everything|grow|1} before us, we had {nothing|hollow|2} before us…' },
  { id: 'gatsby', book: 'The Great Gatsby', author: 'F. Scott Fitzgerald', year: 1925,
    text: 'So we {beat|breathe|2} on, boats {against|lean|2} the {current|wave|2}, borne {back|mirror|2} {ceaselessly|echo|3} into the {past|fade|3}.' },
  { id: 'tell-tale', book: 'The Tell-Tale Heart', author: 'Edgar Allan Poe', year: 1843,
    text: 'Oh God! what could I do? I {foamed|tremble|2}—I {raved|jagged|2}—I swore! … It grew {louder|grow|1}—{louder|grow|2}—{louder|grow|3}! And still the men chatted {pleasantly|wave|1}, and smiled.' },
  { id: 'pride', book: 'Pride and Prejudice', author: 'Jane Austen', year: 1813,
    text: 'It is a truth {universally|expand|2} acknowledged, that a {single|isolate|2} man in possession of a good {fortune|heavy|2}, must be in {want|magnet|2} of a wife.' },
  { id: 'frankenstein', book: 'Frankenstein', author: 'Mary Shelley', year: 1818,
    text: 'It was already one in the morning; the rain {pattered|rain|2} dismally against the panes, and my candle was nearly {burnt out|fade|3}, when, by the {glimmer|flicker|2} of the {half-extinguished|split|2} light, I saw the dull yellow eye of the creature {open|expand|2}; it breathed hard, and a {convulsive|tremble|3} motion agitated its limbs.' },
  { id: 'whitman', book: 'Song of Myself', author: 'Walt Whitman', year: 1892,
    text: 'Do I {contradict|mirror|1} myself?\nVery well then I {contradict|twist|2} myself,\n(I am {large|grow|3}, I contain {multitudes|echo|3}.)' },
  { id: 'dickinson', book: '“Hope” is the thing with feathers', author: 'Emily Dickinson', year: 1891,
    text: '“{Hope|rise|2}” is the thing with {feathers|scatter|1} –\nThat {perches|stack|1} in the soul –\nAnd sings the {tune|wave|2} without the {words|hollow|2} –\nAnd {never stops|echo|2} – {at all|shrink|3} –' },
  { id: 'moby-dick', book: 'Moby-Dick', author: 'Herman Melville', year: 1851,
    text: 'Call me Ishmael. Some years ago—never mind how {long|stretch|3} precisely—having {little|shrink|2} or no money in my purse, and {nothing|fade|2} particular to interest me on shore, I thought I would sail about a little and see the {watery|wave|2} part of the {world|expand|2}.' },
  { id: 'curiouser', book: 'Alice’s Adventures in Wonderland', author: 'Lewis Carroll', year: 1865,
    text: '“{Curiouser|grow|1} and {curiouser|grow|2}!” cried Alice (she was so much surprised, that for the moment she quite forgot how to speak good English); “now I’m {opening out|stretch|3} like the {largest|grow|3} telescope that ever was! Good-bye, {feet|shrink|3}!”' },
  { id: 'ulysses', book: 'Ulysses', author: 'James Joyce', year: 1922,
    text: '…and first I put my arms around him yes and drew him {down|fall|1} to me so he could feel my breasts all perfume yes and his {heart|breathe|2} was going like {mad|scatter|3} and {yes|grow|1} I said {yes|grow|2} I will {Yes|magnet|3}.' },
];

const SAMPLE = 'I kept the letter for years. Every time I opened it the words looked smaller, and the room felt heavier, until one morning in the rain I let it fall.';

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const pos = (i, L) => (L.length > 1 ? i / (L.length - 1) : 0);
const signed = r => (r() < 0.5 ? -1 : 1);

// ---------- the effects ----------
// Each one gets the word wrapper (c), its letter spans (L), a strength 1–3 (n), a seeded random (r).
const FX = {
  fall(c, L, n, r) {
    const dir = signed(r);
    L.forEach((s, i) => {
      const t = pos(i, L);
      const y = Math.pow(t, 1.7) * 0.55 * n;
      const rot = dir * Math.pow(t, 1.4) * (18 + 14 * r()) * n * 0.6 + (r() - 0.5) * 8 * t;
      s.style.transform = `translateY(${y}em) rotate(${rot}deg)`;
    });
    c.style.marginBottom = `${0.55 * n + 0.1}em`;
  },
  rise(c, L, n, r) {
    c.style.fontWeight = 300;
    L.forEach((s, i) => {
      const t = pos(i, L);
      s.style.transform = `translateY(${-Math.pow(t, 1.2) * 0.42 * n}em) rotate(${(r() - 0.5) * 10}deg)`;
    });
    c.style.marginTop = `${0.42 * n}em`;
  },
  sink(c, L, n) {
    c.style.fontWeight = 800; c.style.fontStretch = '82%';
    L.forEach((s, i) => { s.style.transform = `translateY(${Math.sin(Math.PI * pos(i, L)) * 0.28 * n}em)`; });
    c.style.marginBottom = `${0.28 * n}em`;
  },
  grow(c, L, n) {
    c.style.fontSize = `${1 + 0.5 * n}em`;
    c.style.fontWeight = Math.min(900, 500 + 130 * n);
    c.style.lineHeight = 1; c.style.letterSpacing = '-0.025em';
  },
  shrink(c, L, n) {
    L.forEach((s, i) => { s.style.fontSize = `${Math.max(0.22, 1 - pos(i, L) * 0.26 * n)}em`; });
  },
  compress(c, L, n) {
    c.style.fontStretch = '62%'; c.style.fontWeight = 800; c.style.letterSpacing = `${-0.035 * n}em`;
  },
  expand(c, L, n) {
    c.style.fontStretch = '125%'; c.style.fontWeight = 300; c.style.letterSpacing = `${0.16 * n}em`;
  },
  stretch(c, L, n) {
    c.style.fontStretch = '125%'; c.style.fontWeight = 300;
    L.forEach((s, i) => { const t = pos(i, L); s.style.marginRight = `${t * t * 0.38 * n}em`; });
  },
  scatter(c, L, n, r) {
    L.forEach(s => {
      s.style.transform = `translate(${(r() - 0.5) * 0.22 * n}em, ${(r() - 0.5) * 0.5 * n}em) rotate(${(r() - 0.5) * 45 * n}deg)`;
    });
    c.style.margin = `${0.2 * n}em 0.05em`;
  },
  tremble(c, L, n, r) {
    c.classList.add('anim'); c.style.fontWeight = 600;
    const a = 0.025 * n, d = 3 * n;
    L.forEach(s => {
      s.style.setProperty('--t0', `translate(${(r() - 0.5) * a * 2}em, ${(r() - 0.5) * a * 2}em) rotate(${(r() - 0.5) * d}deg)`);
      s.style.setProperty('--t1', `translate(${(r() - 0.5) * a * 2}em, ${(r() - 0.5) * a * 2}em) rotate(${(r() - 0.5) * d}deg)`);
      s.style.setProperty('--d', `${0.07 + r() * 0.08}s`);
      s.style.setProperty('--ease', 'steps(2, end)');
    });
  },
  breathe(c, L, n) {
    c.classList.add('breathe'); c.style.fontWeight = 600;
    c.style.setProperty('--s', 1 + 0.08 * n);
  },
  fade(c, L, n) {
    c.style.fontWeight = 250;
    L.forEach((s, i) => { s.style.opacity = Math.max(0.06, 1 - pos(i, L) * 0.31 * n); });
  },
  hollow(c, L, n) {
    c.classList.add('hollow');
    c.style.letterSpacing = `${0.03 * n}em`;
  },
  radiate(c, L, n, r) {
    c.classList.add('hollow');
    const count = 3 + n * 2;
    for (let k = 0; k < count; k++) {
      const t = count > 1 ? k / (count - 1) : 0.5;
      const ray = el('span', 'ray'); ray.setAttribute('aria-hidden', 'true');
      ray.style.left = `${8 + t * 84}%`;
      ray.style.height = `${0.3 + r() * 0.3 + 0.1 * n}em`;
      ray.style.transform = `rotate(${(t - 0.5) * 70}deg)`;
      c.append(ray);
    }
    c.style.marginTop = `${0.4 + 0.12 * n}em`;
  },
  dark(c, L, n) {
    c.classList.add('dark');
    L.forEach((s, i) => { s.style.transform = `translateY(${pos(i, L) * 0.05 * n}em)`; });
  },
  mirror(c, L, n) {
    c.style.transform = n >= 3 ? 'scale(-1, -1)' : 'scaleX(-1)';
    c.style.fontWeight = 500;
  },
  echo(c, L, n, r, text) {
    const k = 1 + n;
    for (let i = 1; i <= k; i++) {
      const e = el('span', 'echo'); e.textContent = text; e.setAttribute('aria-hidden', 'true');
      e.style.transform = `translate(${i * 0.13}em, ${-i * 0.09}em)`;
      e.style.opacity = 0.7 / i;
      c.append(e);
    }
    c.style.marginRight = `${k * 0.13}em`;
    c.style.marginTop = `${k * 0.09}em`;
  },
  wave(c, L, n) {
    c.classList.add('anim');
    const a = 0.08 * n;
    L.forEach((s, i) => {
      s.style.setProperty('--t0', `translateY(${a}em)`);
      s.style.setProperty('--t1', `translateY(${-a}em)`);
      s.style.setProperty('--ts', `translateY(${Math.sin(i * 0.9) * a}em)`);
      s.style.setProperty('--d', '1.1s');
      s.style.setProperty('--dl', `${-i * 0.17}s`);
    });
    c.style.margin = `${a}em 0`;
  },
  magnet(c, L, n, r, text) {
    let g = /^\p{Lu}/u.test(text) ? 0 : Math.min(L.length - 1, Math.max(0, Math.round((L.length - 1) * (0.3 + r() * 0.4))));
    L.forEach((s, i) => {
      if (i === g) {
        s.style.fontSize = `${2.3 + 0.7 * n}em`;
        s.style.fontWeight = 800; s.style.lineHeight = 0.82; s.style.letterSpacing = '-0.04em';
      } else {
        s.classList.add('knock');
        s.style.transform = `translateY(${0.04 + r() * 0.25}em) rotate(${(r() - 0.5) * 44}deg)`;
        if (i === g - 1) s.style.marginRight = '-0.3em';
        if (i === g + 1) s.style.marginLeft = '-0.3em';
      }
    });
  },
  isolate(c, L, n) {
    c.style.margin = `0 ${0.8 * n}em`; c.style.fontWeight = 300; c.style.letterSpacing = '0.05em';
  },
  split(c, L, n, r) {
    const half = Math.ceil(L.length / 2);
    L.forEach((s, i) => {
      s.style.transform = i < half
        ? `translateY(${-0.04 * n}em)`
        : `translate(${0.06 * n}em, ${0.2 * n}em) rotate(${3 + r() * 4}deg)`;
    });
    c.style.marginBottom = `${0.2 * n}em`;
  },
  flicker(c, L, n, r) {
    c.classList.add('flick'); c.style.fontWeight = 300;
    L.forEach(s => {
      s.style.setProperty('--d', `${1.4 + r() * (4 - n)}s`);
      s.style.setProperty('--dl', `${-r() * 3}s`);
      if (r() < 0.12 * n) s.style.opacity = 0.35;
    });
  },
  rain(c, L, n, r) {
    c.classList.add('drip');
    L.forEach(s => {
      s.style.setProperty('--y', `${0.3 + 0.15 * n}em`);
      s.style.setProperty('--d', `${2.2 + r() * 2.4}s`);
      s.style.setProperty('--dl', `${-r() * 4}s`);
    });
  },
  stack(c, L, n) {
    c.classList.add('stack');
    c.style.fontWeight = 400 + 150 * n;
  },
  jagged(c, L, n, r) {
    c.style.fontWeight = 900; c.style.fontStretch = '70%';
    const d = signed(r);
    L.forEach((s, i) => {
      const sgn = i % 2 ? d : -d;
      s.style.transform = `translateY(${sgn * 0.05 * n}em) rotate(${sgn * (8 + 6 * n)}deg)`;
    });
  },
  lean(c, L, n) {
    c.style.fontWeight = 600; c.style.letterSpacing = '-0.02em';
    L.forEach((s, i) => {
      s.style.transformOrigin = '50% 100%';
      s.style.transform = `skewX(${-(4 + pos(i, L) * 12) * n}deg)`;
    });
  },
  heavy(c, L, n) {
    c.style.fontWeight = 900; c.style.fontStretch = '115%'; c.style.letterSpacing = '-0.03em';
    L.forEach(s => { s.style.transformOrigin = '50% 100%'; s.style.transform = `scaleY(${1 - 0.09 * n})`; });
  },
  twist(c, L, n) {
    L.forEach((s, i) => {
      const t = pos(i, L);
      s.style.transform = `translateY(${-Math.sin(t * Math.PI) * 0.2 * n}em) rotate(${t * 60 * n}deg)`;
    });
    c.style.margin = `${0.2 * n}em 0.1em`;
  },
};
const ORDER = ['fall', 'rise', 'sink', 'grow', 'shrink', 'compress', 'expand', 'stretch', 'heavy', 'fade',
  'hollow', 'radiate', 'dark', 'scatter', 'tremble', 'jagged', 'breathe', 'wave', 'rain', 'flicker',
  'echo', 'mirror', 'twist', 'lean', 'split', 'stack', 'isolate', 'magnet'];

// ---------- a small feeling list for your own text ----------
const LEXICON = {
  fall: 'fall fell fallen drop dropped plunge plummet descend tumble collapse',
  stack: 'down beneath under tall tower deep',
  sink: 'sink sank sunk sad sadness sorrow grief despair worst weary tired dread gloom depress',
  heavy: 'heavy heavier weight burden fortune power powerful strong fearless iron stone',
  grow: 'grow grew big large huge vast loud louder great greater giant swell everything',
  shrink: 'small smaller little tiny shrink less fewer diminish quiet quieter faint',
  compress: 'tight press pressed compress crowd crowded narrow trap trapped squeeze cramped',
  expand: 'wide open opened opening universal free freedom space world sky',
  stretch: 'long longer endless forever stretch slow slowly wait waiting',
  scatter: 'scatter scattered break broke broken shatter chaos mad madness wild foolish',
  tremble: 'tremble trembling shake shook shiver fear afraid nervous convulsive cold',
  breathe: 'breathe breath breathed heart pulse alive beat beating',
  fade: 'fade faded forget forgot past gone vanish dying died burnt whisper memory remember nothing',
  radiate: 'light bright shine shining illuminate glow sun morning dawn',
  dark: 'dark darkness night black shadow shadows midnight',
  mirror: 'back reverse mirror return returned contradict backward',
  echo: 'echo again repeat ceaseless always never nevermore multitude multitudes many',
  wave: 'water sea wave waves current river ocean watery sail flow drift tide',
  rise: 'rise rose up fly flew lift soar heaven best hope float',
  isolate: 'alone single lonely only isolated apart end',
  split: 'split half divide divided torn cut',
  flicker: 'flicker glimmer candle flame spark blink',
  rain: 'rain raining drip tears cry cried weep wept',
  jagged: 'harsh sharp anger angry rage pain scream shout cruel',
  lean: 'against resist push lean wind',
  twist: 'twist turn turned spin spiral dizzy confused',
  magnet: 'magnet attract pull drawn love want desire',
  hollow: 'empty hollow absence void words',
};
const LEX = {};
for (const [fx, words] of Object.entries(LEXICON)) for (const w of words.split(' ')) LEX[w] = fx;
function suggest(core) {
  const w = core.toLowerCase();
  if (LEX[w]) return LEX[w];
  for (const key in LEX) if (key.length >= 4 && w.length > key.length && w.startsWith(key)) return LEX[key];
  return null;
}

// ---------- parsing ----------
function tokenizePlain(str, out) {
  for (const part of str.split(/(\n|[ \t]+|—)/)) {
    if (!part) continue;
    if (part === '\n') out.push({ type: 'br' });
    else if (/^[ \t]+$/.test(part)) out.push({ type: 'space' });
    else {
      const m = part.match(/^([^\p{L}\p{N}]*)([\s\S]*?)([^\p{L}\p{N}]*)$/u);
      if (!m[2]) out.push({ type: 'punct', text: part });
      else out.push({ type: 'word', lead: m[1], core: m[2], trail: m[3], fx: null, n: 2 });
    }
  }
}
function parseMarked(str) {
  const out = [], re = /\{([^|}]+)\|([a-z]+)(?:\|(\d))?\}/g;
  let last = 0, m;
  while ((m = re.exec(str))) {
    tokenizePlain(str.slice(last, m.index), out);
    out.push({ type: 'word', lead: '', core: m[1], trail: '', fx: m[2], n: +(m[3] || 2) });
    last = re.lastIndex;
  }
  tokenizePlain(str.slice(last), out);
  return out;
}
function parseOwn(str) {
  const out = [];
  tokenizePlain(str.replace(/\r/g, ''), out);
  const words = out.filter(t => t.type === 'word');
  const budget = Math.max(1, Math.ceil(words.length / 7));
  let used = 0;
  for (const t of words) {
    if (used >= budget) break;
    const fx = suggest(t.core);
    if (fx) { t.fx = fx; used++; }
  }
  return out;
}

// ---------- state ----------
const state = { mode: 'read', idx: 0, seed: 1, plain: false, sel: -1, editing: false, mine: null };
PASSAGES.forEach(p => { p.tokens = parseMarked(p.text); });
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const tokens = () => (state.mode === 'read' ? PASSAGES[state.idx].tokens : state.mine || []);
const seedFor = i => (state.seed * 7919 + i * 104729 + state.idx * 31) >>> 0;

// ---------- rendering ----------
function buildCore(text, fx, n, seed) {
  const c = el('span', 'fx');
  if (!fx || !FX[fx]) { c.textContent = text; return c; }
  c.dataset.fx = fx;
  const L = Array.from(text).map(ch => {
    const s = el('span', 'l'); s.textContent = ch === ' ' ? ' ' : ch; s.setAttribute('aria-hidden', 'true');
    c.append(s); return s;
  });
  const sr = el('span', 'sr'); sr.textContent = text; c.append(sr);
  FX[fx](c, L, n, rng(seed), text);
  return c;
}
function wordEl(t, i) {
  const w = el('span', 'w');
  w.dataset.i = i; w.tabIndex = 0; w.setAttribute('role', 'button');
  if (t.lead) w.append(t.lead);
  w.append(buildCore(t.core, state.plain ? null : t.fx, t.n, seedFor(i)));
  if (t.trail) w.append(t.trail);
  if (i === state.sel) w.classList.add('sel');
  return w;
}
function renderPiece() {
  const piece = $('piece');
  piece.replaceChildren();
  tokens().forEach((t, i) => {
    if (t.type === 'space') piece.append(' ');
    else if (t.type === 'br') piece.append(el('br'));
    else if (t.type === 'punct') piece.append(t.text);
    else piece.append(wordEl(t, i));
  });
}
function renderChrome() {
  const read = state.mode === 'read';
  $('tab-read').setAttribute('aria-pressed', read);
  $('tab-mine').setAttribute('aria-pressed', !read);
  $('tab-plain').setAttribute('aria-pressed', state.plain);
  $('stage').hidden = !read && state.editing;
  $('foot').hidden = !read && state.editing;
  $('writer').hidden = read || !state.editing;
  $('prev').hidden = $('next').hidden = $('count').hidden = !read;
  $('edit').hidden = read;
  if (read) {
    const p = PASSAGES[state.idx];
    $('cite').innerHTML = '';
    const em = el('em'); em.textContent = p.book;
    $('cite').append(em, ` — ${p.author}, ${p.year}`);
    $('count').textContent = `${state.idx + 1} / ${PASSAGES.length}`;
  } else {
    $('cite').innerHTML = '<em>Your text</em> — first effects come from a word list';
  }
}
function render(fadeIn) {
  renderChrome();
  renderPiece();
  if (fadeIn && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    $('piece').animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'ease-out' });
  }
}

// ---------- effect picker ----------
function openSheet(i) {
  state.sel = i;
  const t = tokens()[i];
  $('sheet-word').textContent = `“${t.core}”`;
  $('lvl').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === t.n));
  const chips = $('chips');
  chips.replaceChildren();
  for (const fx of ['none', ...ORDER]) {
    const b = el('button', 'chip');
    b.dataset.fx = fx;
    b.setAttribute('aria-pressed', (t.fx || 'none') === fx);
    const prev = el('span', 'chip-prev');
    prev.append(buildCore(t.core, fx === 'none' ? null : fx, t.n, seedFor(i)));
    const name = el('span', 'chip-name'); name.textContent = fx;
    b.append(prev, name);
    chips.append(b);
  }
  $('sheet').hidden = false;
  if (state.plain) { state.plain = false; }
  render();
}
function closeSheet() {
  $('sheet').hidden = true;
  const back = document.querySelector(`.w[data-i="${state.sel}"]`);
  state.sel = -1;
  render();
  if (back) document.querySelector(`.w[data-i="${back.dataset.i}"]`)?.focus();
}

// ---------- events ----------
$('piece').addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (w) openSheet(+w.dataset.i);
});
$('piece').addEventListener('keydown', e => {
  const w = e.target.closest('.w');
  if (w && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSheet(+w.dataset.i); }
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b || state.sel < 0) return;
  const t = tokens()[state.sel];
  t.fx = b.dataset.fx === 'none' ? null : b.dataset.fx;
  $('chips').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});
$('lvl').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || state.sel < 0) return;
  tokens()[state.sel].n = +b.dataset.n;
  openSheet(state.sel);
});
$('sheet-close').addEventListener('click', closeSheet);

function go(d) {
  state.idx = (state.idx + d + PASSAGES.length) % PASSAGES.length;
  $('sheet').hidden = true; state.sel = -1;
  render(true);
}
$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('shuffle').addEventListener('click', () => { state.seed++; render(); if (!$('sheet').hidden) openSheet(state.sel); });
$('tab-plain').addEventListener('click', () => { state.plain = !state.plain; $('sheet').hidden = true; state.sel = -1; render(); });
$('tab-read').addEventListener('click', () => { state.mode = 'read'; $('sheet').hidden = true; state.sel = -1; render(true); });
$('tab-mine').addEventListener('click', () => {
  state.mode = 'mine'; $('sheet').hidden = true; state.sel = -1;
  state.editing = !state.mine;
  render(true);
  if (state.editing) $('src').focus();
});
$('edit').addEventListener('click', () => { state.editing = true; $('sheet').hidden = true; state.sel = -1; render(); $('src').focus(); });
$('cancel').addEventListener('click', () => { state.mode = 'read'; render(true); });
$('compose').addEventListener('click', () => {
  const text = $('src').value.trim();
  if (!text) { $('src').focus(); return; }
  store.set('felt-type:draft', $('src').value);
  state.mine = parseOwn(text);
  state.editing = false;
  render(true);
});
$('src').addEventListener('input', () => store.set('felt-type:draft', $('src').value));
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea')) return;
  if (e.key === 'Escape' && !$('sheet').hidden) closeSheet();
  else if ($('sheet').hidden && state.mode === 'read' && e.key === 'ArrowRight') go(1);
  else if ($('sheet').hidden && state.mode === 'read' && e.key === 'ArrowLeft') go(-1);
});

// ---------- start ----------
$('src').value = store.get('felt-type:draft') || SAMPLE;
const fromHash = PASSAGES.findIndex(p => p.id === location.hash.slice(1));
if (fromHash >= 0) state.idx = fromHash;
render();
</script>

<!doctype html>
<html lang="ar-SA" dir="rtl">
<head>

<style>
  body { font-family: "IBM Plex Sans Arabic", sans-serif; margin: 0; }

  .logo { font-weight: 700; font-size: 22px; }
  nav a { margin-inline-start: 24px; color: #222; text-decoration: none; }
  .hero { max-width: 1200px; padding-inline: 24px; text-align: start; }
  h1 { font-size: clamp(36px, 8vw, 56px); line-height: 1.4; }
  p { line-height: 1.8; max-width: 520px; }
  .cta { display: inline-block; background: #0a7; color: #fff; padding: 14px 24px; border-radius: 8px; }
  .arrow-icon { display: inline-block; margin-inline-start: 8px; transform: scaleX(-1); }

</head>

</header>
<section class="hero">
  <h1>اشترِ الآن وادفع لاحقاً</h1>

  <a class="cta" href="#">ابدأ الآن ←</a> <span class="arrow-icon">➜</span>
  <form>
    <input type="tel" placeholder="+966 5X XXX XXXX">
    <input type="email" placeholder="name@example.com">
  </form>
</section>
</body>
</html>

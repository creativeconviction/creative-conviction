<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريب - إتمام الطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3ef;
            --card-bg: #ffffff;
            --primary: #0d6b4e;
            --primary-dark: #09533c;
            --primary-light: #e8f5f0;
            --accent: #e8a838;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-muted: #999999;
            --border: #e8e5e0;
            --border-active: #0d6b4e;
            --danger: #d94040;
            --success: #0d6b4e;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.10);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 18px;
            --radius-xl: 22px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --sticky-footer-height: 90px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: calc(var(--sticky-footer-height) + 20px);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 12px;
        }

        /* Header */
        .checkout-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 6px 4px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg);
            padding-top: 6px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            flex-shrink: 0;
            color: var(--text);
        }
        .back-btn:hover {
            background: #f0ede9;
            box-shadow: var(--shadow-md);
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            transform: scaleX(-1);
        }
        .checkout-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        /* Card base */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 1.5px solid transparent;
        }
        .card:hover {
            box-shadow: var(--shadow-md);
        }
        .card.selected {
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px rgba(13, 107, 78, 0.08), var(--shadow-md);
            background: #fafff9;
        }

        /* Address Card */
        .address-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: default;
        }
        .address-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--primary);
        }
        .address-icon svg {
            width: 22px;
            height: 22px;
        }
        .address-details {
            flex: 1;
            min-width: 0;
        }
        .address-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .address-text {
            font-weight: 600;
            font-size: 0.98rem;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 4px;
        }
        .address-edit {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--primary-light);
            transition: var(--transition);
            border: none;
            font-family: inherit;
        }
        .address-edit:hover {
            background: #d0ede0;
            color: var(--primary-dark);
        }
        .address-edit svg {
            width: 14px;
            height: 14px;
        }

        /* Section titles */
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .icon-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--primary);
        }
        .section-title .icon-circle svg {
            width: 16px;
            height: 16px;
        }

        /* Delivery Time */
        .time-toggle {
            display: flex;
            background: #f0ede9;
            border-radius: 25px;
            padding: 4px;
            gap: 2px;
            margin-bottom: 14px;
        }
        .time-toggle-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 22px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            white-space: nowrap;
        }
        .time-toggle-btn.active {
            background: #fff;
            color: var(--text);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }
        .time-slots {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .time-slots::-webkit-scrollbar {
            height: 0;
        }
        .time-slot-chip {
            flex-shrink: 0;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition);
            background: #fff;
            color: var(--text);
            white-space: nowrap;
            font-family: inherit;
            min-width: 100px;
            text-align: center;
        }
        .time-slot-chip:hover {
            border-color: #c0bbb2;
            background: #fafaf8;
        }
        .time-slot-chip.selected {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 700;
            box-shadow: 0 2px 10px rgba(13, 107, 78, 0.3);
        }

        /* Cart Items */
        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #f0ede9;
        }
        .cart-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .cart-item:first-child {
            padding-top: 0;
        }
        .cart-item-info {
            flex: 1;
            min-width: 0;
        }
        .cart-item-name {
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cart-item-unit-price {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .qty-stepper {
            display: flex;
            align-items: center;
            gap: 0;
            background: #f5f3ef;
            border-radius: 22px;
            overflow: hidden;
            border: 1.5px solid #e8e5e0;
        }
        .qty-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            line-height: 1;
            user-select: none;
        }
        .qty-btn:hover {
            background: #e8e5e0;
        }
        .qty-btn:active {
            background: #d5d1c9;
        }
        .qty-btn.minus {
            color: var(--text-secondary);
        }
        .qty-btn.plus {
            color: var(--primary);
        }
        .qty-value {
            width: 32px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            user-select: none;
            line-height: 34px;
            background: #fff;
            border-left: 1.5px solid #e8e5e0;
            border-right: 1.5px solid #e8e5e0;
        }
        .cart-item-total {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            min-width: 55px;
            text-align: left;
            direction: ltr;
            flex-shrink: 0;
        }

        /* Promo Code */
        .promo-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .promo-input {
            flex: 1;
            padding: 11px 16px;
            border-radius: 25px;
            border: 1.5px solid var(--border);
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: 500;
            transition: var(--transition);
            background: #fafaf8;
            color: var(--text);
            min-width: 0;
            direction: ltr;
            text-align: right;
        }
        .promo-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 107, 78, 0.06);
            background: #fff;
        }
        .promo-input::placeholder {
            color: #b5b0a8;
        }
        .promo-apply-btn {
            padding: 11px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            transition: var(--transition);
            background: var(--text);
            color: #fff;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .promo-apply-btn:hover {
            background: #333;
            box-shadow: var(--shadow-md);
        }
        .promo-apply-btn:active {
            transform: scale(0.96);
        }
        .promo-msg {
            font-size: 0.8rem;
            margin-top: 8px;
            font-weight: 600;
            min-height: 0;
            transition: var(--transition);
        }
        .promo-msg.success {
            color: var(--success);
        }
        .promo-msg.error {
            color: var(--danger);
        }

        /* Payment Methods */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .payment-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            background: #fff;
            font-family: inherit;
            width: 100%;
            text-align: right;
            font-size: 0.9rem;
        }
        .payment-option:hover {
            border-color: #c0bbb2;
            background: #fafaf8;
        }
        .payment-option.selected {
            border-color: var(--border-active);
            background: #fafff9;
            box-shadow: 0 0 0 3px rgba(13, 107, 78, 0.07);
        }
        .payment-radio {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #d0ccc4;
            flex-shrink: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .payment-option.selected .payment-radio {
            border-color: var(--primary);
            background: var(--primary);
        }
        .payment-option.selected .payment-radio::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
        }
        .payment-icon-area {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.3rem;
            background: #f8f7f4;
        }
        .payment-option.selected .payment-icon-area {
            background: var(--primary-light);
        }
        .payment-label {
            font-weight: 600;
            flex: 1;
            color: var(--text);
        }
        .payment-badge {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 3px 10px;
            border-radius: 12px;
            flex-shrink: 0;
        }

        /* Order Total Breakdown */
        .total-breakdown {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .total-row.discount {
            color: var(--success);
            font-weight: 600;
        }
        .total-row.grand-total {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text);
            padding-top: 10px;
            margin-top: 4px;
            border-top: 1.5px dashed #e0dcd4;
        }
        .total-amount {
            font-weight: 700;
            direction: ltr;
            unicode-bidi: plaintext;
            color: var(--text);
            flex-shrink: 0;
            margin-right: 16px;
        }
        .total-amount.grand {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
        .total-row.discount .total-amount {
            color: var(--success);
        }

        /* Sticky Footer */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            z-index: 100;
            background: #fff;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.10);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px 20px 0 0;
            height: var(--sticky-footer-height);
        }
        .footer-total-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }
        .footer-total-amount {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary-dark);
            direction: ltr;
            unicode-bidi: plaintext;
            white-space: nowrap;
        }
        .footer-total-col {
            display: flex;
            flex-direction: column;
            gap: 0;
            flex-shrink: 0;
        }
        .place-order-btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--primary);
            color: #fff;
            font-family: inherit;
            white-space: nowrap;
            letter-spacing: -0.2px;
            box-shadow: 0 4px 16px rgba(13, 107, 78, 0.35);
            text-align: center;
        }
        .place-order-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 22px rgba(13, 107, 78, 0.45);
            transform: translateY(-1px);
        }
        .place-order-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(13, 107, 78, 0.3);
        }

        /* Desktop adjustments */
        @media (min-width: 640px) {
            .container {
                gap: 14px;
                padding: 0 16px;
                padding-top: 20px;
            }
            .card {
                padding: 20px 22px;
                border-radius: var(--radius-xl);
            }
            .sticky-footer {
                border-radius: 22px 22px 0 0;
                padding: 14px 20px;
                height: 96px;
                max-width: 600px;
            }
            body {
                padding-bottom: 110px;
            }
            .checkout-header h1 {
                font-size: 1.5rem;
            }
            .time-slot-chip {
                padding: 12px 20px;
                font-size: 0.88rem;
            }
            .place-order-btn {
                font-size: 1.05rem;
                padding: 16px 28px;
            }
        }
        @media (min-width: 900px) {
            .container {
                max-width: 640px;
            }
            .sticky-footer {
                max-width: 640px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="checkout-header">
            <button class="back-btn" aria-label="رجوع" title="رجوع">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <h1>إتمام الطلب</h1>
        </header>

        <!-- Address Card -->
        <section class="card address-card" id="addressCard">
            <div class="address-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <div class="address-details">
                <div class="address-label">عنوان التوصيل</div>
                <div class="address-text">شارع الأمير محمد بن عبدالعزيز، حي العليا، الرياض 12221، المملكة العربية السعودية</div>
                <button class="address-edit" aria-label="تعديل العنوان">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    تعديل
                </button>
            </div>
        </section>

        <!-- Delivery Time -->
        <section class="card" id="deliveryTimeCard">
            <div class="section-title">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </span>
                وقت التوصيل
            </div>
            <div class="time-toggle" id="timeToggle">
                <button class="time-toggle-btn active" data-day="today">اليوم</button>
                <button class="time-toggle-btn" data-day="tomorrow">غداً</button>
            </div>
            <div class="time-slots" id="timeSlots">
                <!-- Filled by JS -->
            </div>
        </section>

        <!-- Cart Summary -->
        <section class="card" id="cartCard">
            <div class="section-title">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </span>
                ملخص الطلب
            </div>
            <div id="cartItems">
                <!-- Filled by JS -->
            </div>
        </section>

        <!-- Promo Code -->
        <section class="card" id="promoCard">
            <div class="section-title" style="margin-bottom:10px;">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                        <line x1="7" y1="7" x2="7.01" y2="7"></line>
                    </svg>
                </span>
                كود الخصم
            </div>
            <div class="promo-row">
                <input type="text" class="promo-input" id="promoInput" placeholder="أدخل كود الخصم" maxlength="30" dir="ltr">
                <button class="promo-apply-btn" id="promoApplyBtn">تطبيق</button>
            </div>
            <div class="promo-msg" id="promoMsg"></div>
        </section>

        <!-- Payment Methods -->
        <section class="card" id="paymentCard">
            <div class="section-title">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                        <line x1="1" y1="10" x2="23" y2="10"></line>
                    </svg>
                </span>
                طريقة الدفع
            </div>
            <div class="payment-options" id="paymentOptions">
                <button class="payment-option selected" data-payment="card" aria-label="البطاقة البنكية">
                    <span class="payment-radio"></span>
                    <span class="payment-icon-area">💳</span>
                    <span class="payment-label">البطاقة البنكية (مدى / فيزا / ماستركارد)</span>
                    <span class="payment-badge">شائع</span>
                </button>
                <button class="payment-option" data-payment="applepay" aria-label="Apple Pay">
                    <span class="payment-radio"></span>
                    <span class="payment-icon-area">🍎</span>
                    <span class="payment-label">Apple Pay</span>
                </button>
                <button class="payment-option" data-payment="cod" aria-label="الدفع عند الاستلام">
                    <span class="payment-radio"></span>
                    <span class="payment-icon-area">💵</span>
                    <span class="payment-label">الدفع نقداً عند الاستلام</span>
                </button>
            </div>
        </section>

        <!-- Order Total Breakdown -->
        <section class="card" id="totalCard">
            <div class="section-title">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </span>
                ملخص الفاتورة
            </div>
            <div class="total-breakdown" id="totalBreakdown">
                <!-- Filled by JS -->
            </div>
        </section>
    </div>

    <!-- Sticky Footer -->
    <footer class="sticky-footer" id="stickyFooter">
        <div class="footer-total-col">
            <span class="footer-total-label">الإجمالي</span>
            <span class="footer-total-amount" id="footerTotal">115.00 ر.س</span>
        </div>
        <button class="place-order-btn" id="placeOrderBtn">تقديم الطلب</button>
    </footer>

    <script>
        (function() {
            // --- Data ---
            const cartItemsData = [
                { id: 1, name: 'برجر دجاج مشوي', unitPrice: 25, qty: 1 },
                { id: 2, name: 'بيتزا مارغريتا', unitPrice: 35, qty: 1 },
                { id: 3, name: 'عصير برتقال طازج', unitPrice: 15, qty: 2 },
            ];

            const deliveryFee = 10;
            const vatRate = 0.15;
            const promoCodeValid = 'ترحيب';
            const promoDiscountPercent = 0.10; // 10% off subtotal

            let appliedPromoDiscount = 0;
            let promoApplied = false;
            let selectedPayment = 'card';
            let selectedDay = 'today';
            let selectedTimeSlot = '5:00 م - 6:00 م';

            // Time slots
            const todaySlots = [
                '3:00 م - 4:00 م',
                '4:00 م - 5:00 م',
                '5:00 م - 6:00 م',
                '6:00 م - 7:00 م',
                '7:00 م - 8:00 م',
                '8:00 م - 9:00 م',
            ];
            const tomorrowSlots = [
                '10:00 ص - 11:00 ص',
                '12:00 م - 1:00 م',
                '2:00 م - 3:00 م',
                '4:00 م - 5:00 م',
                '6:00 م - 7:00 م',
                '8:00 م - 9:00 م',
            ];

            // --- DOM refs ---
            const cartItemsEl = document.getElementById('cartItems');
            const timeSlotsEl = document.getElementById('timeSlots');
            const timeToggleEl = document.getElementById('timeToggle');
            const totalBreakdownEl = document.getElementById('totalBreakdown');
            const footerTotalEl = document.getElementById('footerTotal');
            const promoInputEl = document.getElementById('promoInput');
            const promoApplyBtn = document.getElementById('promoApplyBtn');
            const promoMsgEl = document.getElementById('promoMsg');
            const paymentOptionsEl = document.getElementById('paymentOptions');
            const placeOrderBtn = document.getElementById('placeOrderBtn');

            // --- Render functions ---
            function getCartItems() {
                return cartItemsData.map(item => ({
                    ...item,
                    lineTotal: item.unitPrice * item.qty,
                }));
            }

            function calcSubtotal() {
                return getCartItems().reduce((sum, item) => sum + item.lineTotal, 0);
            }

            function calcDiscount(subtotal) {
                if (!promoApplied) return 0;
                return Math.round(subtotal * promoDiscountPercent * 100) / 100;
            }

            function calcTotals() {
                const subtotal = calcSubtotal();
                const discount = calcDiscount(subtotal);
                const afterDiscount = subtotal - discount;
                const vatBase = afterDiscount + deliveryFee;
                const vat = Math.round(vatBase * vatRate * 100) / 100;
                const total = Math.round((afterDiscount + deliveryFee + vat) * 100) / 100;
                return { subtotal, discount, deliveryFee, vat, total, afterDiscount };
            }

            function formatSAR(amount) {
                return amount.toFixed(2) + ' ر.س';
            }

            function renderCartItems() {
                const items = getCartItems();
                cartItemsEl.innerHTML = items.map((item, index) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-unit-price">${formatSAR(item.unitPrice)} للوحدة</div>
                        </div>
                        <div class="cart-item-actions">
                            <div class="qty-stepper">
                                <button class="qty-btn minus" data-index="${index}" aria-label="تقليل الكمية">−</button>
                                <span class="qty-value">${item.qty}</span>
                                <button class="qty-btn plus" data-index="${index}" aria-label="زيادة الكمية">+</button>
                            </div>
                            <span class="cart-item-total">${formatSAR(item.lineTotal)}</span>
                        </div>
                    </div>
                `).join('');

                // Attach events
                cartItemsEl.querySelectorAll('.qty-btn.minus').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.index);
                        if (cartItemsData[idx].qty > 1) {
                            cartItemsData[idx].qty--;
                            refreshAll();
                        }
                    });
                });
                cartItemsEl.querySelectorAll('.qty-btn.plus').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.index);
                        if (cartItemsData[idx].qty < 99) {
                            cartItemsData[idx].qty++;
                            refreshAll();
                        }
                    });
                });
            }

            function renderTimeSlots() {
                const slots = selectedDay === 'today' ? todaySlots : tomorrowSlots;
                // Ensure selected slot is valid for current day
                if (!slots.includes(selectedTimeSlot)) {
                    selectedTimeSlot = slots[0];
                }
                timeSlotsEl.innerHTML = slots.map(slot => `
                    <button class="time-slot-chip${slot === selectedTimeSlot ? ' selected' : ''}" data-slot="${slot}">${slot}</button>
                `).join('');

                timeSlotsEl.querySelectorAll('.time-slot-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        selectedTimeSlot = chip.dataset.slot;
                        renderTimeSlots();
                    });
                });
            }

            function renderTotalBreakdown() {
                const t = calcTotals();
                let html = `
                    <div class="total-row">
                        <span>المجموع الفرعي</span>
                        <span class="total-amount">${formatSAR(t.subtotal)}</span>
                    </div>`;
                if (t.discount > 0) {
                    html += `
                    <div class="total-row discount">
                        <span>🎉 خصم (${promoCodeValid})</span>
                        <span class="total-amount">−${formatSAR(t.discount)}</span>
                    </div>`;
                }
                html += `
                    <div class="total-row">
                        <span>رسوم التوصيل</span>
                        <span class="total-amount">${formatSAR(t.deliveryFee)}</span>
                    </div>
                    <div class="total-row">
                        <span>ضريبة القيمة المضافة (15%)</span>
                        <span class="total-amount">${formatSAR(t.vat)}</span>
                    </div>
                    <div class="total-row grand-total">
                        <span>الإجمالي الكلي</span>
                        <span class="total-amount grand">${formatSAR(t.total)}</span>
                    </div>
                `;
                totalBreakdownEl.innerHTML = html;
                footerTotalEl.textContent = formatSAR(t.total);
            }

            function refreshAll() {
                renderCartItems();
                renderTimeSlots();
                renderTotalBreakdown();
            }

            // --- Time toggle ---
            timeToggleEl.querySelectorAll('.time-toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    timeToggleEl.querySelectorAll('.time-toggle-btn').forEach(b => b.classList
                        .remove('active'));
                    btn.classList.add('active');
                    selectedDay = btn.dataset.day;
                    const slots = selectedDay === 'today' ? todaySlots : tomorrowSlots;
                    selectedTimeSlot = slots[Math.min(slots.indexOf(selectedTimeSlot) >= 0 ? slots
                        .indexOf(selectedTimeSlot) : 0, slots.length - 1
                    )];
                    if (!slots.includes(selectedTimeSlot)) selectedTimeSlot = slots[0];
                    renderTimeSlots();
                });
            });

            // --- Promo code ---
            promoApplyBtn.addEventListener('click', () => {
                const code = promoInputEl.value.trim();
                if (!code) {
                    promoMsgEl.textContent = 'الرجاء إدخال كود الخصم';
                    promoMsgEl.className = 'promo-msg error';
                    return;
                }
                if (code === promoCodeValid) {
                    if (promoApplied) {
                        promoMsgEl.textContent = 'تم تطبيق الكود مسبقاً ✓';
                        promoMsgEl.className = 'promo-msg success';
                    } else {
                        promoApplied = true;
                        promoMsgEl.textContent = '✅ تم تطبيق الخصم بنجاح!';
                        promoMsgEl.className = 'promo-msg success';
                        promoInputEl.value = '';
                        refreshAll();
                    }
                } else {
                    promoMsgEl.textContent = '❌ كود الخصم غير صالح';
                    promoMsgEl.className = 'promo-msg error';
                }
            });
            promoInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    promoApplyBtn.click();
                }
            });
            promoInputEl.addEventListener('input', () => {
                if (promoMsgEl.textContent) {
                    promoMsgEl.textContent = '';
                    promoMsgEl.className = 'promo-msg';
                }
            });

            // --- Payment options ---
            paymentOptionsEl.querySelectorAll('.payment-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    paymentOptionsEl.querySelectorAll('.payment-option').forEach(o => o.classList
                        .remove('selected'));
                    opt.classList.add('selected');
                    selectedPayment = opt.dataset.payment;
                });
            });

            // --- Place order ---
            placeOrderBtn.addEventListener('click', () => {
                const t = calcTotals();
                const paymentLabels = {
                    card: 'البطاقة البنكية',
                    applepay: 'Apple Pay',
                    cod: 'الدفع نقداً عند الاستلام',
                };
                const msg =
                    `✅ تم تقديم الطلب بنجاح!\n\n` +
                    `📦 إجمالي الطلب: ${formatSAR(t.total)}\n` +
                    `🕐 وقت التوصيل: ${selectedDay === 'today' ? 'اليوم' : 'غداً'} - ${selectedTimeSlot}\n` +
                    `💳 طريقة الدفع: ${paymentLabels[selectedPayment]}\n\n` +
                    `شكراً لاختيارك قريب! 🚀`;
                alert(msg);
            });

            // --- Initial render ---
            renderCartItems();
            renderTimeSlots();
            renderTotalBreakdown();

            // Set initial time toggle active
            const initialToggleBtn = timeToggleEl.querySelector('[data-day="today"]');
            if (initialToggleBtn) initialToggleBtn.classList.add('active');
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاريب - onboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2C5F5D;
            --primary-hover: #224d4a;
            --text-color: #1E1E1E;
            --text-light: #555555;
            --white: #FFFFFF;
            --accent-yellow: #FFD700;
            --border-color: #E0E0E0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            background-color: #fafafa;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            text-align: right;
            color: var(--text-color);
            background-color: var(--white);
        }

        .onboarding-carousel {
            position: relative;
            max-width: 390px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            background-color: var(--white);
        }

        .carousel-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .slide {
            display: none;
            text-align: center;
            width: 100%;
        }

        .slide.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slide-illustration {
            margin-bottom: 1.5rem;
            height: 180px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            color: var(--primary-color);
        }

        .slide-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .slide-description {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-light);
            max-width: 320px;
        }

        .slide-description span {
            color: var(--primary-color);
            font-weight: 700;
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1.5rem 1.25rem;
            gap: 0.5rem;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--border-color);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .indicator.active {
            background-color: var(--primary-color);
        }

        .carousel-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem 1.75rem;
            border-top: 1px solid var(--border-color);
        }

        .skip-link {
            font-size: 0.9rem;
            color: var(--text-light);
            text-decoration: none;
        }

        .skip-link:hover {
            color: var(--text-color);
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border: none;
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #f0f0f0;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-cta {
            padding: 0.85rem 2rem;
            border-radius: 28px;
            font-size: 1rem;
            font-weight: 700;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-cta:hover {
            background-color: var(--primary-hover);
        }

        @media (min-width: 414px) {
            .onboarding-carousel {
                max-height: 85vh;
            }
            .slide-description {
                font-size: 1.1rem;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }
            .onboarding-carousel {
                max-width: 450px;
            }
        }
    </style>
</head>
<body>

    <div class="onboarding-carousel" id="onboardingCarousel">

        <div class="carousel-container">
            <div class="slides-wrapper">
                <!-- Slide 1 -->
                <div class="slide active" data-slide="1">
                    <div class="slide-illustration" aria-hidden="true">
                        &#128231;
                    </div>
                    <h2 class="slide-title">مرحبًا بك في جاريب</h2>
                    <p class="slide-description">المنصة الأولى لعلاقة المورد بالمشتري عبر du <span>MMM</span></p>
                </div>
                <!-- Slide 2 -->
                <div class="slide" data-slide="2">
                    <div class="slide-illustration" aria-hidden="true">
                        &#128172;
                    </div>
                    <h2 class="slide-title"> hoe does this work?</h2>
                    <p class="slide-description">انشئ حسابك في 3 خطوات سهلة لاستعراض عروض المزادات و تلقي تنبيهات <span>MMM</span></p>
                </div>
                <!-- Slide 3 -->
                <div class="slide" data-slide="3">
                    <div class="slide-illustration" aria-hidden="true">
                        &#9881;
                    </div>
                    <h2 class="slide-title">ابدأ رحلتك مع جاريب</h2>
                    <p class="slide-description">افتح حسابك الآن و استعرض المنتجات وそれより gần nhất أو gato <span>900-123-000</span></p>
                </div>
            </div>
        </div>

        <div class="carousel-indicators" id="carouselIndicators">
            <button class="indicator active" aria-label="انتقل إلى الشريحة 1"></button>
            <button class="indicator" aria-label="انتقل إلى الشريحة 2"></button>
            <button class="indicator" aria-label="انتقل إلى الشريحة 3"></button>
        </div>

        <div class="carousel-controls">
            <a href="#" class="skip-link" id="skipLink">تخطي</a>
            <div class="control-buttons">
                <button class="btn btn-secondary" id="backBtn">للخلف</button>
                <button class="btn btn-primary" id="nextBtn">التالي</button>
            </div>
        </div>

        <div class="carousel-controls" style="display: none;" id="finalControls">
             <div style="flex-grow: 1;"></div> <!-- Spacer -->
             <button class="btn-cta" id="getStartedBtn">ابدأ الآن</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const carousel = document.getElementById('onboardingCarousel');
            const slides = carousel.querySelectorAll('.slide');
            const indicators = carousel.querySelectorAll('.indicator');
            const nextBtn = document.getElementById('nextBtn');
            const backBtn = document.getElementById('backBtn');
            const skipLink = document.getElementById('skipLink');
            const finalControls = document.getElementById('finalControls');
            const slidesWrapper = carousel.querySelector('.slides-wrapper');

            let currentSlide = 0;

            function showSlide(index) {
                slides.forEach((slide, i) => {
                    slide.classList.toggle('active', i === index);
                });
                indicators.forEach((indicator, i) => {
                    indicator.classList.toggle('active', i === index);
                });

                if (index === slides.length - 1) {
                    // Last slide
                    carousel.querySelector('.carousel-controls:not(#finalControls)').style.display = 'none';
                    finalControls.style.display = 'flex';
                } else {
                    carousel.querySelector('.carousel-controls:not(#finalControls)').style.display = 'flex';
                    finalControls.style.display = 'none';
                }
                currentSlide = index;
            }

            function goToSlide(index) {
                if (index >= 0 && index < slides.length) {
                    showSlide(index);
                }
            }

            nextBtn.addEventListener('click', () => {
                goToSlide(currentSlide + 1);
            });

            backBtn.addEventListener('click', () => {
                goToSlide(currentSlide - 1);
            });

            skipLink.addEventListener('click', (e) => {
                e.preventDefault();
                goToSlide(slides.length - 1); // Go to last slide
            });

            indicators.forEach((indicator, i) => {
                indicator.addEventListener('click', () => {
                    goToSlide(i);
                });
            });

            getStartedBtn.addEventListener('click', () => {
                // Placeholder for action
                alert('تم النقر على ابدأ الآن');
            });
        });
    </script>

</body>
</html>

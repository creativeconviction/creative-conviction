<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - قريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0e7c3a;
            --primary-dark: #0a5e2c;
            --primary-light: #e8f5e9;
            --bg: #f3f5f0;
            --white: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #5c6b5e;
            --border: #dde4db;
            --error: #d32f2f;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #eef2ea;
            background-image: radial-gradient(ellipse at 50% 0%, #d4e8d0 0%, #eef2ea 55%, #e8ede4 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* الحاوية الرئيسية */
        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* الترويسة */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--white);
            border-bottom: 1px solid #f0f3ed;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid #e8ebe4;
            background: #fafbf9;
            cursor: pointer;
            color: #3d4f3c;
            transition: all var(--transition);
            flex-shrink: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-back:hover {
            background: #f0f4ed;
            border-color: #d0d8cb;
            color: #1a2f1a;
        }
        .btn-back:active {
            background: #e4ece0;
            transform: scale(0.95);
            transition: 0.1s ease;
        }
        .btn-back svg {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .header-brand .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header-brand .brand-icon svg {
            width: 18px;
            height: 18px;
            color: #fff;
        }

        .header-spacer {
            width: 38px;
            flex-shrink: 0;
        }

        /* المحتوى */
        .content {
            padding: 8px 20px 28px;
            flex: 1;
            overflow-y: auto;
        }

        .form-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }
        .form-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 22px;
            text-align: center;
            line-height: 1.5;
        }

        /* مجموعة الحقول */
        .field-group {
            margin-bottom: 16px;
            position: relative;
        }

        .field-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #3a4d39;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f9fbf7;
            border: 1.8px solid #e2e7de;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            background: #fdfefc;
            box-shadow: 0 0 0 4px rgba(14, 124, 58, 0.06);
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 13px 14px;
            font-size: 0.95rem;
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            outline: none;
            width: 100%;
            min-width: 0;
            letter-spacing: -0.1px;
        }
        .input-wrapper input::placeholder {
            color: #b5bfb0;
            font-weight: 400;
        }
        .input-wrapper input:autofill {
            -webkit-box-shadow: 0 0 0 30px #f9fbf7 inset;
            box-shadow: 0 0 0 30px #f9fbf7 inset;
        }

        /* بادئة الهاتف */
        .phone-prefix {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 13px 6px 13px 14px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5d48;
            white-space: nowrap;
            background: #f2f5ef;
            border-left: 1.8px solid #e2e7de;
            user-select: none;
            letter-spacing: -0.2px;
        }
        .phone-prefix .flag-icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* زر إظهار/إخفاء كلمة المرور */
        .btn-toggle-password {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #8a9a85;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all var(--transition);
            z-index: 2;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-toggle-password:hover {
            color: #5a6b55;
            background: rgba(0, 0, 0, 0.03);
        }
        .btn-toggle-password:active {
            color: #3a4d35;
            transform: translateY(-50%) scale(0.9);
        }
        .btn-toggle-password svg {
            width: 19px;
            height: 19px;
            pointer-events: none;
        }

        /* مع وجود زر الإظهار، نضيف padding لليمين (في RTL يكون left) */
        .input-wrapper.has-toggle input {
            padding-left: 42px;
        }

        /* مربع الموافقة */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0 10px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-group input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            min-width: 20px;
            border: 2px solid #c5cdc0;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
            background: #fafcf8;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .checkbox-group input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }
        .checkbox-group input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 6px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .checkbox-group input[type="checkbox"]:focus-visible {
            outline: 2px solid rgba(14, 124, 58, 0.4);
            outline-offset: 2px;
        }
        .checkbox-label {
            font-size: 0.85rem;
            color: #4a5a47;
            line-height: 1.6;
            font-weight: 500;
        }
        .checkbox-label a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            white-space: nowrap;
        }
        .checkbox-label a:hover {
            text-decoration: underline;
            color: var(--primary-dark);
        }

        /* زر إنشاء الحساب */
        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 10px;
            letter-spacing: -0.2px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-submit:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(14, 124, 58, 0.25);
            transform: translateY(-1px);
        }
        .btn-submit:active {
            background: #095227;
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(14, 124, 58, 0.2);
            transition: 0.08s ease;
        }
        .btn-submit:focus-visible {
            outline: 3px solid rgba(14, 124, 58, 0.5);
            outline-offset: 3px;
        }

        /* رابط تسجيل الدخول */
        .login-link-row {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .login-link-row a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: color var(--transition);
        }
        .login-link-row a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* رسالة خطأ صغيرة (للتحقق) */
        .field-hint {
            font-size: 0.75rem;
            color: #8a9a85;
            margin-top: 4px;
            display: none;
        }

        /* شريط تزييني سفلي */
        .decorative-strip {
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, #3cb371 40%, #7ccd7c 70%, #c8e6c9 100%);
            border-radius: 0 0 20px 20px;
        }

        /* تحسينات لسطح المكتب */
        @media (min-width: 440px) {
            .app-container {
                border-radius: 24px;
            }
            .decorative-strip {
                border-radius: 0 0 24px 24px;
            }
            .content {
                padding: 12px 28px 32px;
            }
            .form-title {
                font-size: 1.45rem;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 24px;
                background-image: radial-gradient(ellipse at 30% 20%, #d4e8d0 0%, #eef2ea 50%, #e0e8db 100%);
            }
            .app-container {
                max-width: 430px;
                box-shadow: 0 12px 50px rgba(0, 0, 0, 0.1), 0 4px 16px rgba(0, 0, 0, 0.05);
            }
        }

        /* حركة بسيطة للتحميل */
        @keyframes subtle-pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        .btn-submit.loading {
            pointer-events: none;
            animation: subtle-pulse 1.2s ease-in-out infinite;
            background: #0f6e35;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- الترويسة -->
        <header class="header">
            <button class="btn-back" type="button" aria-label="رجوع" onclick="history.back()" title="رجوع">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>

            <div class="header-brand">
                <span class="brand-icon">
                    <!-- أيقونة سلة/بقالة -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1.5"/>
                        <circle cx="18" cy="21" r="1.5"/>
                        <path d="M1 3h2.5l1.8 9.2a2.2 2.2 0 0 0 2.2 1.8h8.3a2.2 2.2 0 0 0 2.2-1.8L19.5 7H5"/>
                    </svg>
                </span>
                <span>قريب</span>
            </div>

            <div class="header-spacer"></div>
            <!-- مساحة فارغة للموازنة -->
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="content">
            <h1 class="form-title">إنشاء حساب جديد</h1>
            <p class="form-subtitle">انضم إلى قريب واطلب بقالتك بكل سهولة</p>

            <form id="signupForm" method="post" novalidate autocomplete="off">
                <!-- حقل الاسم الكامل -->
                <div class="field-group">
                    <label class="field-label" for="fullName">الاسم الكامل</label>
                    <div class="input-wrapper">
                        <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="أدخل اسمك الكامل"
                        required
                        autocomplete="name"
                        aria-required="true"
                        >
                    </div>
                    <span class="field-hint" id="fullNameHint">يرجى إدخال الاسم الكامل</span>
                </div>

                <!-- حقل رقم الجوال -->
                <div class="field-group">
                    <label class="field-label" for="phoneNumber">رقم الجوال</label>
                    <div class="input-wrapper">
                        <span class="phone-prefix">
                            <span class="flag-icon">🇸🇦</span> +966
                        </span>
                        <input
                        type="tel"
                        id="phoneNumber"
                        name="phoneNumber"
                        placeholder="5xxxxxxxx"
                        required
                        maxlength="9"
                        inputmode="numeric"
                        pattern="[0-9]{9}"
                        autocomplete="tel-national"
                        aria-required="true"
                        >
                    </div>
                    <span class="field-hint" id="phoneHint">يرجى إدخال 9 أرقام</span>
                </div>

                <!-- حقل البريد الإلكتروني -->
                <div class="field-group">
                    <label class="field-label" for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@mail.com"
                        required
                        autocomplete="email"
                        dir="ltr"
                        aria-required="true"
                        >
                    </div>
                    <span class="field-hint" id="emailHint">يرجى إدخال بريد إلكتروني صحيح</span>
                </div>

                <!-- حقل كلمة المرور -->
                <div class="field-group">
                    <label class="field-label" for="password">كلمة المرور</label>
                    <div class="input-wrapper has-toggle">
                        <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أنشئ كلمة مرور قوية"
                        required
                        minlength="8"
                        autocomplete="new-password"
                        aria-required="true"
                        >
                        <button
                        type="button"
                        class="btn-toggle-password"
                        id="togglePasswordBtn"
                        aria-label="إظهار كلمة المرور"
                        title="إظهار كلمة المرور"
                        >
                        <!-- أيقونة العين (مفتوحة) -->
                        <svg id="eyeOpenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <!-- أيقونة العين (مغلقة - مخفية افتراضياً) -->
                        <svg id="eyeClosedIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <span class="field-hint" id="passwordHint">كلمة المرور يجب أن تكون 8 أحرف على الأقل</span>
            </div>

            <!-- مربع الموافقة على الشروط -->
            <label class="checkbox-group" for="agreeTerms">
                <input type="checkbox" id="agreeTerms" name="agreeTerms" required aria-required="true">
                <span class="checkbox-label">
                    أوافق على
                    <a href="#" target="_blank" rel="noopener noreferrer" aria-label="الشروط والأحكام (يفتح في نافذة جديدة)">الشروط والأحكام</a>
                    و
                    <a href="#" target="_blank" rel="noopener noreferrer" aria-label="سياسة الخصوصية (يفتح في نافذة جديدة)">سياسة الخصوصية</a>
                </span>
            </label>

            <!-- زر إنشاء الحساب -->
            <button type="submit" class="btn-submit" id="submitBtn">
                إنشاء حساب
            </button>
        </form>

        <!-- رابط تسجيل الدخول -->
        <p class="login-link-row">
            لديك حساب بالفعل؟
            <a href="#" aria-label="تسجيل الدخول إلى حسابك">تسجيل الدخول</a>
        </p>
    </main>

    <!-- شريط تزييني -->
    <div class="decorative-strip"></div>
</div>

<script>
    (function() {
        // --- زر إظهار/إخفاء كلمة المرور ---
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const eyeOpenIcon = document.getElementById('eyeOpenIcon');
        const eyeClosedIcon = document.getElementById('eyeClosedIcon');

        let passwordVisible = false;

        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            passwordVisible = !passwordVisible;

            if (passwordVisible) {
                passwordInput.type = 'text';
                eyeOpenIcon.style.display = 'none';
                eyeClosedIcon.style.display = 'block';
                toggleBtn.setAttribute('aria-label', 'إخفاء كلمة المرور');
                toggleBtn.setAttribute('title', 'إخفاء كلمة المرور');
            } else {
                passwordInput.type = 'password';
                eyeOpenIcon.style.display = 'block';
                eyeClosedIcon.style.display = 'none';
                toggleBtn.setAttribute('aria-label', 'إظهار كلمة المرور');
                toggleBtn.setAttribute('title', 'إظهار كلمة المرور');
            }
            // إعادة التركيز على حقل كلمة المرور
            passwordInput.focus();
        });

        // --- منع toggle button من سرقة التركيز عند النقر ---
        toggleBtn.addEventListener('mousedown', function(e) {
            e.preventDefault();
        });

        // --- التحقق البسيط عند الإرسال ---
        const form = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');

        const fullNameInput = document.getElementById('fullName');
        const phoneInput = document.getElementById('phoneNumber');
        const emailInput = document.getElementById('email');
        const agreeCheckbox = document.getElementById('agreeTerms');

        const fullNameHint = document.getElementById('fullNameHint');
        const phoneHint = document.getElementById('phoneHint');
        const emailHint = document.getElementById('emailHint');
        const passwordHint = document.getElementById('passwordHint');

        // دالة لإظهار/إخفاء التلميحات
        function showHint(hintEl, show) {
            if (hintEl) {
                hintEl.style.display = show ? 'block' : 'none';
                if (show) {
                    hintEl.style.color = '#c0392b';
                } else {
                    hintEl.style.color = '#8a9a85';
                }
            }
        }

        function resetHints() {
            [fullNameHint, phoneHint, emailHint, passwordHint].forEach(function(h) {
                if (h) {
                    h.style.display = 'none';
                    h.style.color = '#8a9a85';
                }
            });
        }

        // تصفية إدخال الهاتف (أرقام فقط)
        phoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 9);
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            resetHints();
            let isValid = true;

            // التحقق من الاسم
            if (!fullNameInput.value.trim()) {
                showHint(fullNameHint, true);
                fullNameInput.closest('.input-wrapper').style.borderColor = '#e57373';
                isValid = false;
            } else {
                fullNameInput.closest('.input-wrapper').style.borderColor = '#e2e7de';
            }

            // التحقق من الهاتف
            if (!/^[0-9]{9}$/.test(phoneInput.value)) {
                showHint(phoneHint, true);
                phoneInput.closest('.input-wrapper').style.borderColor = '#e57373';
                isValid = false;
            } else {
                phoneInput.closest('.input-wrapper').style.borderColor = '#e2e7de';
            }

            // التحقق من البريد الإلكتروني
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                showHint(emailHint, true);
                emailInput.closest('.input-wrapper').style.borderColor = '#e57373';
                isValid = false;
            } else {
                emailInput.closest('.input-wrapper').style.borderColor = '#e2e7de';
            }

            // التحقق من كلمة المرور
            if (passwordInput.value.length < 8) {
                showHint(passwordHint, true);
                passwordInput.closest('.input-wrapper').style.borderColor = '#e57373';
                isValid = false;
            } else {
                passwordInput.closest('.input-wrapper').style.borderColor = '#e2e7de';
            }

            // التحقق من الموافقة
            if (!agreeCheckbox.checked) {
                agreeCheckbox.style.outline = '2px solid #e57373';
                agreeCheckbox.style.outlineOffset = '3px';
                setTimeout(function() {
                    agreeCheckbox.style.outline = '';
                    agreeCheckbox.style.outlineOffset = '';
                }, 1800);
                isValid = false;
            }

            if (isValid) {
                // محاكاة إرسال ناجح
                submitBtn.classList.add('loading');
                submitBtn.textContent = 'جارٍ إنشاء الحساب...';
                submitBtn.disabled = true;

                // في الواقع هنا يتم إرسال البيانات للخادم
                setTimeout(function() {
                    submitBtn.classList.remove('loading');
                    submitBtn.textContent = 'تم إنشاء الحساب ✓';
                    submitBtn.style.background = '#1b8a4a';
                    // إعادة تعيين بعد فترة
                    setTimeout(function() {
                        submitBtn.textContent = 'إنشاء حساب';
                        submitBtn.style.background = '';
                        submitBtn.disabled = false;
                        form.reset();
                        resetHints();
                        // إعادة ضبط حالة كلمة المرور
                        if (passwordVisible) {
                            toggleBtn.click();
                        }
                    }, 2000);
                }, 1200);
            } else {
                // هز خفيف للزر للتنبيه
                submitBtn.style.transform = 'translateX(-4px)';
                setTimeout(function() {
                    submitBtn.style.transform = 'translateX(4px)';
                }, 80);
                setTimeout(function() {
                    submitBtn.style.transform = 'translateX(-3px)';
                }, 160);
                setTimeout(function() {
                    submitBtn.style.transform = '';
                }, 240);
            }
        });

        // إعادة تعيين حدود الحقول عند الكتابة
        [fullNameInput, phoneInput, emailInput, passwordInput].forEach(function(input) {
            input.addEventListener('input', function() {
                var wrapper = input.closest('.input-wrapper');
                if (wrapper && wrapper.style.borderColor === 'rgb(229, 115, 115)') {
                    wrapper.style.borderColor = '#e2e7de';
                }
                // إخفاء التلميح المرتبط
                var hintId = input.id + 'Hint';
                var hint = document.getElementById(hintId);
                if (hint && hint.style.display === 'block') {
                    hint.style.display = 'none';
                    hint.style.color = '#8a9a85';
                }
            });
        });

        // إعادة تعيين حدود مربع الموافقة
        agreeCheckbox.addEventListener('change', function() {
            if (this.checked) {
                this.style.outline = '';
                this.style.outlineOffset = '';
            }
        });
    })();
</script>
</body>
</html>

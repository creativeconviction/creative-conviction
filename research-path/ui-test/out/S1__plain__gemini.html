<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إنشاء حساب - قريب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; /* Emerald green for grocery theme */
            --primary-hover: #059669;
            --primary-light: rgba(16, 185, 129, 0.1);
            --bg-color: #f3f4f6;
            --app-bg: #ffffff;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
            --input-bg: #f9fafb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .app-container {
            background-color: var(--app-bg);
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Desktop styling */
        @media (min-width: 480px) {
            .app-container {
                min-height: auto;
                height: 844px;
                border-radius: 24px;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
                margin: 20px 0;
            }
        }

        header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--app-bg);
            border-bottom: 1px solid #f3f4f6;
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin-right: -8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .back-btn:active {
            background-color: var(--bg-color);
        }

        header h1 {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
        }

        .header-spacer {
            width: 40px; /* Matches back button to center title */
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 40px;
        }

        .welcome-text {
            margin-bottom: 28px;
        }

        .welcome-text h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .welcome-text p {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        .input-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            background-color: var(--input-bg);
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .input-control::placeholder {
            color: #9ca3af;
        }

        .input-control:focus, .phone-wrapper:focus-within {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-light);
            outline: none;
        }

        /* Phone Input specific */
        .phone-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--input-bg);
            transition: all 0.2s ease;
            direction: ltr; /* Forces left-to-right for phone format */
        }

        .country-code {
            padding: 14px 16px;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 15px;
            border-right: 1px solid var(--border-color);
            background-color: #f3f4f6;
            border-radius: 12px 0 0 12px;
        }

        .phone-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 16px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-dark);
            outline: none;
        }

        /* Password Input specific */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-left: 48px; /* Make room for eye icon on the left (RTL) */
        }

        .toggle-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-btn:hover {
            color: var(--text-dark);
        }

        /* Checkbox styling */
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 24px;
            margin-bottom: 28px;
        }

        .checkbox-container input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            min-width: 20px;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            margin-top: 2px;
            cursor: pointer;
            position: relative;
            background-color: var(--app-bg);
            transition: all 0.2s ease;
        }

        .checkbox-container input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-container input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            font-weight: 500;
        }

        .checkbox-label a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        /* Buttons & Links */
        .primary-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .primary-btn:hover {
            background-color: var(--primary-hover);
        }

        .login-link {
            text-align: center;
            margin-top: 28px;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .login-link a {
            color: var(--primary);
            font-weight: 800;
            text-decoration: none;
            margin-right: 4px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <button class="back-btn" aria-label="الرجوع">
                <!-- RTL arrow points Right -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <h1>إنشاء حساب</h1>
            <div class="header-spacer"></div>
        </header>

        <main>
            <div class="welcome-text">
                <h2>قريب 🛒</h2>
                <p>سجل الآن وابدأ بتسوق مقاضيك بكل سهولة.</p>
            </div>

            <form action="#" method="POST" id="signupForm">
                
                <div class="input-group">
                    <label for="fullname">الاسم الكامل</label>
                    <input type="text" id="fullname" class="input-control" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="input-group">
                    <label for="phone">رقم الجوال</label>
                    <div class="phone-wrapper">
                        <span class="country-code">+966</span>
                        <input type="tel" id="phone" class="phone-input" placeholder="5X XXX XXXX" pattern="[0-9]*" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" class="input-control" placeholder="example@domain.com" dir="ltr" style="text-align: right;" required>
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="input-control" placeholder="أدخل كلمة المرور" required>
                        <button type="button" class="toggle-btn" id="togglePassword" aria-label="إظهار كلمة المرور">
                            <!-- Eye Icon (Closed by default) -->
                            <svg id="eye-off" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                            <!-- Eye Icon (Open) -->
                            <svg id="eye-on" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" class="checkbox-label">
                        لقد قرأت وأوافق على <a href="#">الشروط والأحكام</a> و <a href="#">سياسة الخصوصية</a> الخاصة بتطبيق قريب.
                    </label>
                </div>

                <button type="submit" class="primary-btn">إنشاء حساب</button>

            </form>

            <div class="login-link">
                لديك حساب بالفعل؟ <a href="#">تسجيل الدخول</a>
            </div>
        </main>
    </div>

    <script>
        // Password toggle visibility functionality
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeOffIcon = document.getElementById('eye-off');
        const eyeOnIcon = document.getElementById('eye-on');

        togglePasswordBtn.addEventListener('click', function () {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle icons
            if (type === 'text') {
                eyeOffIcon.style.display = 'none';
                eyeOnIcon.style.display = 'block';
                this.setAttribute('aria-label', 'إخفاء كلمة المرور');
            } else {
                eyeOffIcon.style.display = 'block';
                eyeOnIcon.style.display = 'none';
                this.setAttribute('aria-label', 'إظهار كلمة المرور');
            }
        });

        // Optional: Prevent form submission for demo purposes
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Form logic would go here
        });
    </script>
</body>
</html>

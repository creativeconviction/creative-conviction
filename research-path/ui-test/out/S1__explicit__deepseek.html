<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - قريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #059669;
            --color-primary-hover: #047857;
            --color-primary-light: #ecfdf5;
            --color-bg: #f3f4f6;
            --color-card: #ffffff;
            --color-text: #111827;
            --color-text-secondary: #6b7280;
            --color-border: #d1d5db;
            --color-border-focus: #059669;
            --color-input-bg: #f9fafb;
            --color-error: #dc2626;
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-card-desktop: 0 2px 8px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.05);
            --transition: 0.2s ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-family: 'Cairo', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
            line-height: 1.6;
            color: var(--color-text);
            background-color: var(--color-bg);
            min-height: 100vh;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            background-color: var(--color-bg);
            background-image: radial-gradient(ellipse at 50% 30%, #ecfdf5 0%, #f3f4f6 60%);
        }

        /* Page container */
        .page-wrapper {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--color-card);
            position: relative;
        }

        @media (min-width: 440px) {
            body {
                padding: 2rem 1rem;
            }
            .page-wrapper {
                min-height: auto;
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-card-desktop);
                max-width: 420px;
                margin: 0 auto;
            }
        }

        @media (min-width: 390px) and (max-width: 439px) {
            .page-wrapper {
                max-width: 100%;
            }
        }

        @media (max-width: 389px) {
            .page-wrapper {
                max-width: 100%;
            }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 0.875rem 0.5rem 0.875rem 1rem;
            gap: 0.5rem;
            border-bottom: 1px solid #f3f4f6;
            position: sticky;
            top: 0;
            background-color: var(--color-card);
            z-index: 10;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--color-text);
            transition: background-color var(--transition);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:hover {
            background-color: #f3f4f6;
        }
        .back-btn:active {
            background-color: #e5e7eb;
            transform: scale(0.96);
        }
        .back-btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .back-btn svg {
            width: 1.5rem;
            height: 1.5rem;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--color-text);
            letter-spacing: -0.01em;
        }

        .header-brand-dot {
            display: inline-block;
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background-color: var(--color-primary);
            margin-inline-end: 0.35rem;
            vertical-align: middle;
            position: relative;
            top: -0.1em;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 1.25rem 1.25rem 2rem;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 440px) {
            .main-content {
                padding: 1.5rem 1.5rem 2.25rem;
            }
        }

        .screen-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .screen-subtitle {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-bottom: 1.75rem;
            font-weight: 400;
        }

        /* Form */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
            flex: 1;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text);
            letter-spacing: -0.01em;
        }

        .form-input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--color-text);
            background-color: var(--color-input-bg);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            transition: all var(--transition);
            outline: none;
            letter-spacing: -0.01em;
        }

        .form-input:focus {
            border-color: var(--color-border-focus);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.08);
        }

        .form-input::placeholder {
            color: #b0b7c3;
            font-weight: 400;
        }

        /* Phone input group */
        .phone-input-group {
            display: flex;
            align-items: stretch;
            background-color: var(--color-input-bg);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all var(--transition);
        }

        .phone-input-group:focus-within {
            border-color: var(--color-border-focus);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.08);
        }

        .phone-prefix {
            display: flex;
            align-items: center;
            padding: 0.7rem 0.75rem 0.7rem 0.4rem;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: #374151;
            background-color: #f3f4f6;
            border-inline-end: 1.5px solid var(--color-border);
            white-space: nowrap;
            user-select: none;
            letter-spacing: 0.02em;
            direction: ltr;
            flex-shrink: 0;
            transition: background-color var(--transition);
        }

        .phone-input-group:focus-within .phone-prefix {
            background-color: #e8f5ee;
            border-inline-end-color: var(--color-border-focus);
        }

        .phone-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.7rem 0.75rem;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--color-text);
            outline: none;
            direction: ltr;
            text-align: start;
            letter-spacing: 0.03em;
            min-width: 0;
        }

        .phone-input::placeholder {
            color: #b0b7c3;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        /* Email input - LTR for English text */
        .email-input {
            direction: ltr;
            text-align: start;
            letter-spacing: 0.02em;
        }
        .email-input::placeholder {
            letter-spacing: 0.02em;
        }

        /* Password field */
        .password-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field-wrapper .form-input {
            padding-inline-end: 3rem;
        }

        .password-toggle-btn {
            position: absolute;
            inset-inline-end: 0.35rem;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.3rem;
            height: 2.3rem;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #9ca3af;
            transition: all var(--transition);
            -webkit-tap-highlight-color: transparent;
            z-index: 2;
        }

        .password-toggle-btn:hover {
            color: #4b5563;
            background-color: #f3f4f6;
        }
        .password-toggle-btn:active {
            transform: translateY(-50%) scale(0.92);
        }
        .password-toggle-btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: -2px;
            color: #4b5563;
        }

        .password-toggle-btn svg {
            width: 1.25rem;
            height: 1.25rem;
            flex-shrink: 0;
            pointer-events: none;
        }

        .eye-off-icon {
            display: none;
        }
        .password-toggle-btn.showing .eye-on-icon {
            display: none;
        }
        .password-toggle-btn.showing .eye-off-icon {
            display: block;
        }

        /* Terms checkbox */
        .terms-field {
            margin-top: 0.3rem;
        }

        .terms-label {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 400;
            color: #4b5563;
            line-height: 1.5;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .terms-checkbox-native {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .terms-checkbox-custom {
            flex-shrink: 0;
            width: 1.3rem;
            height: 1.3rem;
            border-radius: 0.3rem;
            border: 1.8px solid #cbd5e1;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            margin-top: 0.15rem;
            position: relative;
        }

        .terms-checkbox-custom svg {
            width: 0.75rem;
            height: 0.75rem;
            opacity: 0;
            transform: scale(0.5);
            transition: all var(--transition);
            color: #fff;
            flex-shrink: 0;
        }

        .terms-checkbox-native:checked+.terms-checkbox-custom {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
        }

        .terms-checkbox-native:checked+.terms-checkbox-custom svg {
            opacity: 1;
            transform: scale(1);
        }

        .terms-checkbox-native:focus-visible+.terms-checkbox-custom {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .terms-link {
            color: var(--color-primary);
            text-decoration: underline;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: color var(--transition);
            text-underline-offset: 0.2em;
        }
        .terms-link:hover {
            color: var(--color-primary-hover);
        }
        .terms-link:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* Submit button */
        .submit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.85rem 1.5rem;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background-color: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: -0.01em;
            margin-top: 0.75rem;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            background-color: var(--color-primary-hover);
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
            transform: translateY(-1px);
        }
        .submit-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
            background-color: #03684a;
        }
        .submit-btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 3px;
        }

        /* Login link */
        .login-prompt {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #4b5563;
            font-weight: 400;
        }

        .login-link {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: color var(--transition);
            white-space: nowrap;
        }
        .login-link:hover {
            color: var(--color-primary-hover);
            text-decoration: underline;
            text-underline-offset: 0.2em;
        }
        .login-link:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* Brand accent bar at top */
        .brand-accent {
            height: 3px;
            background: linear-gradient(to left, #059669, #34d399, #059669);
            border-radius: 0;
            flex-shrink: 0;
        }

        @media (min-width: 440px) {
            .brand-accent {
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            }
        }

        /* Subtle animation for the card on desktop */
        @media (min-width: 440px) {
            .page-wrapper {
                animation: fadeInUp 0.4s ease-out;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RTL-specific adjustments */
        [dir="rtl"] .phone-input {
            text-align: start;
        }

        [dir="rtl"] .email-input {
            text-align: start;
        }

        /* Ensure numbers display correctly in RTL */
        [dir="rtl"] input[type="tel"],
        [dir="rtl"] input[type="email"] {
            unicode-bidi: plaintext;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <!-- Brand accent bar -->
        <div class="brand-accent"></div>

        <!-- Header -->
        <header class="header">
            <button class="back-btn" aria-label="رجوع" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 5 16 12 9 19"></polyline>
                </svg>
            </button>
            <span class="header-title">
                <span class="header-brand-dot"></span>قريب
            </span>
        </header>

        <!-- Main content -->
        <main class="main-content">
            <h1 class="screen-title">إنشاء حساب</h1>
            <p class="screen-subtitle">انضم إلى قريب واطلب مقاضيك بسهولة</p>

            <form class="signup-form" novalidate autocomplete="off">
                <!-- Full Name -->
                <div class="form-field">
                    <label class="form-label" for="fullName">الاسم الكامل</label>
                    <input
                    class="form-input"
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="أدخل اسمك الكامل"
                    autocomplete="name"
                    required
                    >
                </div>

                <!-- Mobile Number -->
                <div class="form-field">
                    <label class="form-label" for="mobileNumber">رقم الجوال</label>
                    <div class="phone-input-group">
                        <span class="phone-prefix" aria-hidden="true">+966</span>
                        <input
                        class="phone-input"
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="5XXXXXXXX"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        dir="ltr"
                        required
                        >
                    </div>
                </div>

                <!-- Email -->
                <div class="form-field">
                    <label class="form-label" for="email">البريد الإلكتروني</label>
                    <input
                    class="form-input email-input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@mail.com"
                    autocomplete="email"
                    dir="ltr"
                    required
                    >
                </div>

                <!-- Password -->
                <div class="form-field">
                    <label class="form-label" for="password">كلمة المرور</label>
                    <div class="password-field-wrapper">
                        <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="new-password"
                        required
                        minlength="8"
                        >
                        <button
                        class="password-toggle-btn"
                        type="button"
                        aria-label="إظهار كلمة المرور"
                        id="passwordToggle"
                        >
                        <!-- Eye open icon (password hidden) -->
                        <svg class="eye-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2.062 12.348a1 1 0 010-.696 10.75 10.75 0 0119.876 0 1 1 0 010 .696 10.75 10.75 0 01-19.876 0z"/>
                            <circle cx="12" cy="12" r="3.2"/>
                        </svg>
                        <!-- Eye off icon (password visible) -->
                        <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 11-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Terms Checkbox -->
            <div class="form-field terms-field">
                <label class="terms-label" for="termsCheckbox">
                    <input
                    class="terms-checkbox-native"
                    type="checkbox"
                    id="termsCheckbox"
                    name="termsCheckbox"
                    required
                    >
                    <span class="terms-checkbox-custom" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </span>
                    <span>
                        أوافق على
                        <a class="terms-link" href="#" target="_blank" rel="noopener noreferrer">الشروط والأحكام</a>
                    </span>
                </label>
            </div>

            <!-- Submit Button -->
            <button class="submit-btn" type="submit">
                إنشاء حساب
            </button>
        </form>

        <!-- Login prompt -->
        <p class="login-prompt">
            لديك حساب؟
            <a class="login-link" href="#">سجل دخول</a>
        </p>
    </main>
</div>

<script>
    (function() {
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        const toggleLabel = passwordToggle.getAttribute('aria-label');
        const hiddenLabel = 'إظهار كلمة المرور';
        const visibleLabel = 'إخفاء كلمة المرور';

        if (passwordToggle && passwordInput) {
            passwordToggle.addEventListener('click', function(e) {
                e.preventDefault();
                const isPassword = passwordInput.type === 'password';

                if (isPassword) {
                    passwordInput.type = 'text';
                    passwordToggle.classList.add('showing');
                    passwordToggle.setAttribute('aria-label', visibleLabel);
                } else {
                    passwordInput.type = 'password';
                    passwordToggle.classList.remove('showing');
                    passwordToggle.setAttribute('aria-label', hiddenLabel);
                }

                // Refocus the input after toggling
                passwordInput.focus();
            });

            // Prevent form submission on toggle button click
            passwordToggle.addEventListener('mousedown', function(e) {
                e.preventDefault();
            });
        }

        // Basic form submission handling
        const form = document.querySelector('.signup-form');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const fullName = document.getElementById('fullName').value.trim();
                const mobileNumber = document.getElementById('mobileNumber').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const termsAccepted = document.getElementById('termsCheckbox').checked;

                // Simple validation feedback
                let hasError = false;
                const fields = [
                    { id: 'fullName', value: fullName, label: 'الاسم الكامل' },
                    { id: 'mobileNumber', value: mobileNumber, label: 'رقم الجوال' },
                    { id: 'email', value: email, label: 'البريد الإلكتروني' },
                ];

                // Clear previous highlights
                document.querySelectorAll('.form-input, .phone-input-group').forEach(el => {
                    el.style.borderColor = '';
                    el.style.boxShadow = '';
                });
                document.querySelectorAll('.phone-input-group').forEach(el => {
                    el.style.borderColor = '';
                    el.style.boxShadow = '';
                });

                // Check empty fields
                fields.forEach(field => {
                    if (!field.value) {
                        hasError = true;
                        const inputEl = document.getElementById(field.id);
                        if (inputEl) {
                            if (field.id === 'mobileNumber') {
                                const group = inputEl.closest('.phone-input-group');
                                if (group) {
                                    group.style.borderColor = '#dc2626';
                                    group.style.boxShadow =
                                        '0 0 0 3px rgba(220,38,38,0.08)';
                                }
                            } else {
                                inputEl.style.borderColor = '#dc2626';
                                inputEl.style.boxShadow =
                                    '0 0 0 3px rgba(220,38,38,0.08)';
                            }
                        }
                    }
                });

                if (!password || password.length < 8) {
                    hasError = true;
                    passwordInput.style.borderColor = '#dc2626';
                    passwordInput.style.boxShadow = '0 0 0 3px rgba(220,38,38,0.08)';
                }

                if (!termsAccepted) {
                    hasError = true;
                    const termsCustom = document.querySelector('.terms-checkbox-custom');
                    if (termsCustom) {
                        termsCustom.style.outline = '2px solid #dc2626';
                        termsCustom.style.outlineOffset = '2px';
                        setTimeout(() => {
                            termsCustom.style.outline = '';
                            termsCustom.style.outlineOffset = '';
                        }, 1800);
                    }
                }

                if (!hasError) {
                    // Success - would normally submit to backend
                    const submitBtn = document.querySelector('.submit-btn');
                    if (submitBtn) {
                        const originalText = submitBtn.textContent;
                        submitBtn.textContent = '...جارٍ إنشاء الحساب';
                        submitBtn.disabled = true;
                        submitBtn.style.opacity = '0.8';
                        submitBtn.style.pointerEvents = 'none';

                        // Simulate API call
                        setTimeout(() => {
                            submitBtn.textContent = 'تم بنجاح ✓';
                            submitBtn.style.backgroundColor = '#059669';
                            submitBtn.style.opacity = '1';
                            setTimeout(() => {
                                submitBtn.textContent = originalText;
                                submitBtn.disabled = false;
                                submitBtn.style.pointerEvents = '';
                                form.reset();
                                passwordInput.type = 'password';
                                passwordToggle.classList.remove('showing');
                                passwordToggle.setAttribute('aria-label',
                                    hiddenLabel);
                            }, 1800);
                        }, 1200);
                    }
                }
            });
        }

        // Back button - dummy navigation
        const backBtn = document.querySelector('.back-btn');
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                // In a real app, this would navigate back
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    // Fallback animation to indicate action
                    backBtn.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        backBtn.style.transform = '';
                    }, 150);
                }
            });
        }
    })();
</script>
</body>
</html>

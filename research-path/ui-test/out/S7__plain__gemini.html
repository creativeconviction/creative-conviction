<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qareeb Onboarding</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #eef2f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1e293b;
        }

        /* Mobile-First App Container (Target: 390px width) */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        /* Desktop specific styling */
        @media (min-width: 480px) {
            .app-container {
                height: 844px; /* Typical modern mobile height */
                max-height: 90vh;
                border-radius: 32px;
            }
        }

        /* Top Bar */
        .header {
            padding: 20px 24px;
            display: flex;
            justify-content: flex-end;
            position: relative;
            z-index: 10;
        }

        .skip-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s ease, color 0.2s;
        }

        .skip-btn:hover {
            color: #2563eb;
        }

        /* Carousel Content Area */
        .carousel-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            width: 300%; /* 3 slides = 300% */
            height: 100%;
            /* In RTL, translating positive percentage moves track to the right, showing leftward items */
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide {
            width: 33.3333%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 32px 40px;
        }

        /* Illustration Placeholders */
        .illustration {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            margin-bottom: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .slide:nth-child(1) .illustration {
            background-color: #eff6ff;
            color: #2563eb;
        }
        .slide:nth-child(2) .illustration {
            background-color: #f0fdf4;
            color: #16a34a;
        }
        .slide:nth-child(3) .illustration {
            background-color: #fff7ed;
            color: #ea580c;
        }

        .illustration svg {
            width: 80px;
            height: 80px;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 16px;
            text-align: center;
            color: #0f172a;
        }

        .description {
            font-size: 16px;
            color: #64748b;
            text-align: center;
            line-height: 1.6;
        }

        /* Bottom Controls */
        .footer {
            padding: 24px 32px 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            background: #ffffff;
            z-index: 10;
        }

        /* Dot Indicators */
        .dots-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: #cbd5e1;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            width: 28px;
            background-color: #2563eb;
        }

        /* Navigation Buttons */
        .buttons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
        }

        .btn {
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        .btn-prev {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 10px 0;
            opacity: 0;
            pointer-events: none;
        }

        .btn-prev.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-next {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0 36px;
            height: 56px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-next:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        /* Expand button to full width on final slide */
        .btn-next.full-width {
            flex: 1;
            margin-right: 16px; /* Space between back button and get started */
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Top Bar -->
        <div class="header">
            <button class="skip-btn" id="skipBtn">تخطي</button>
        </div>

        <!-- Carousel -->
        <div class="carousel-wrapper">
            <div class="carousel-track" id="track">
                
                <!-- Slide 1 -->
                <div class="slide">
                    <div class="illustration">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </div>
                    <h2 class="title">أهلاً بك في قريب</h2>
                    <p class="description">اكتشف الخدمات والمتاجر القريبة منك بكل سهولة وسرعة من خلال تطبيقنا.</p>
                </div>

                <!-- Slide 2 -->
                <div class="slide">
                    <div class="illustration">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </div>
                    <h2 class="title">تصفح واطلب</h2>
                    <p class="description">اختر ما يناسبك من العروض الحصرية واطلب بضغطة زر لتصلك أينما كنت.</p>
                </div>

                <!-- Slide 3 -->
                <div class="slide">
                    <div class="illustration">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="8" width="18" height="12" rx="2" ry="2"></rect>
                            <path d="M16 8V6a4 4 0 0 0-8 0v2"></path>
                            <circle cx="12" cy="14" r="2"></circle>
                        </svg>
                    </div>
                    <h2 class="title">توصيل سريع</h2>
                    <p class="description">مندوبونا جاهزون لتوصيل طلباتك إلى باب بيتك في أسرع وقت وبأعلى جودة.</p>
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="footer">
            <div class="dots-container" id="dotsContainer">
                <div class="dot active" data-index="0"></div>
                <div class="dot" data-index="1"></div>
                <div class="dot" data-index="2"></div>
            </div>
            
            <div class="buttons-container">
                <button class="btn btn-prev" id="prevBtn">السابق</button>
                <button class="btn btn-next" id="nextBtn">التالي</button>
            </div>
        </div>

    </div>

    <script>
        const track = document.getElementById('track');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const skipBtn = document.getElementById('skipBtn');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = 3;
        let currentSlide = 0;

        function updateUI() {
            // Update Carousel Position 
            // In RTL layout, translating by a positive X percentage moves the container to the right,
            // which pulls the elements on the left into the viewport.
            track.style.transform = `translateX(${currentSlide * 33.3333}%)`;

            // Update Dots
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });

            // Update Controls State
            if (currentSlide === 0) {
                prevBtn.classList.remove('visible');
                nextBtn.textContent = 'التالي';
                nextBtn.classList.remove('full-width');
                skipBtn.style.opacity = '1';
                skipBtn.style.pointerEvents = 'auto';
            } else if (currentSlide === 1) {
                prevBtn.classList.add('visible');
                nextBtn.textContent = 'التالي';
                nextBtn.classList.remove('full-width');
                skipBtn.style.opacity = '1';
                skipBtn.style.pointerEvents = 'auto';
            } else if (currentSlide === 2) {
                prevBtn.classList.add('visible');
                nextBtn.textContent = 'ابدأ الآن';
                nextBtn.classList.add('full-width');
                skipBtn.style.opacity = '0';
                skipBtn.style.pointerEvents = 'none';
            }
        }

        // Event Listeners
        nextBtn.addEventListener('click', () => {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateUI();
            } else {
                // Action for "Get Started"
                alert('مرحباً بك في تطبيق قريب!');
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentSlide > 0) {
                currentSlide--;
                updateUI();
            }
        });

        skipBtn.addEventListener('click', () => {
            currentSlide = totalSlides - 1;
            updateUI();
        });

        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                currentSlide = parseInt(e.target.getAttribute('data-index'));
                updateUI();
            });
        });

        // Initialize UI
        updateUI();
    </script>
</body>
</html>

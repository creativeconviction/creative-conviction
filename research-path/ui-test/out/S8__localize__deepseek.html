<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5f1">
  <title>قريب — الإعدادات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --page: #eeece7;
      --surface: #f8f7f4;
      --card: #ffffff;
      --text: #1d201d;
      --muted: #777b75;
      --border: #ecece8;
      --accent: #ec6a32;
      --accent-soft: #fff0e9;
      --green: #2e7d5b;
      --green-soft: #e9f5ef;
      --danger: #d7473f;
      --danger-soft: #fff0ef;
      --shadow: 0 18px 55px rgba(31, 35, 31, 0.11);
      --switch-off: #d8dad6;
    }

    body.dark {
      color-scheme: dark;
      --page: #121412;
      --surface: #181b18;
      --card: #222522;
      --text: #f3f4f1;
      --muted: #a5aaa4;
      --border: #303430;
      --accent-soft: #3a251d;
      --green-soft: #1d342a;
      --danger-soft: #3a2221;
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.34);
      --switch-off: #454a45;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--page);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: "DM Sans", "Tajawal", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      padding: 0 18px 38px;
      background: var(--surface);
      transition: background-color 180ms ease;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 10px 10px 3px 10px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 5px 13px rgba(236, 106, 50, 0.25);
    }

    .page-title {
      margin: 13px 0 18px;
      font-size: 29px;
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 8px 26px rgba(28, 33, 28, 0.04);
    }

    .avatar {
      position: relative;
      display: grid;
      flex: 0 0 auto;
      width: 62px;
      height: 62px;
      place-items: center;
      overflow: hidden;
      border: 3px solid var(--card);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 34%, #f4c59c 0 17%, transparent 18%),
        radial-gradient(ellipse at 50% 90%, #315f52 0 42%, transparent 43%),
        linear-gradient(145deg, #f5d59f, #ed8b5f);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .avatar::before {
      position: absolute;
      top: 7px;
      width: 25px;
      height: 14px;
      border-radius: 50% 50% 35% 35%;
      background: #352b28;
      content: "";
      transform: rotate(4deg);
    }

    .profile-copy {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      margin: 0 0 4px;
      overflow: hidden;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.25px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-detail {
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edit-button {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
    }

    .section {
      margin-top: 25px;
    }

    .section-title {
      margin: 0 5px 9px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .list {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
    }

    .row {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 62px;
      align-items: center;
      gap: 13px;
      padding: 10px 14px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: right;
    }

    button.row {
      cursor: pointer;
    }

    .row + .row::before {
      position: absolute;
      top: 0;
      left: 14px;
      right: 61px;
      height: 1px;
      background: var(--border);
      content: "";
    }

    .icon-box {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .icon-box.green {
      background: var(--green-soft);
      color: var(--green);
    }

    .icon-box.neutral {
      background: color-mix(in srgb, var(--muted) 12%, transparent);
      color: var(--muted);
    }

    .icon-box.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .row-label {
      min-width: 0;
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.15px;
    }

    .row-value {
      max-width: 120px;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      flex: 0 0 auto;
      color: #a8aaa7;
      transform: scaleX(-1);
    }

    .danger-text {
      color: var(--danger);
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 46px;
      height: 27px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: var(--switch-off);
      transition: background-color 180ms ease;
    }

    .switch-track::after {
      display: block;
      width: 21px;
      height: 21px;
      margin: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(20, 24, 20, 0.24);
      content: "";
      transition: transform 180ms ease;
    }

    .switch input:checked + .switch-track {
      background: var(--accent);
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(-19px);
    }

    .switch input:focus-visible + .switch-track {
      outline: 3px solid rgba(236, 106, 50, 0.22);
      outline-offset: 2px;
    }

    svg {
      display: block;
    }

    .version {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .overlay {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(18, 22, 18, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 480px;
      padding: 10px 18px 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      transform: translateY(22px);
      transition: transform 180ms ease;
    }

    .overlay.open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      margin: 0 auto 15px;
      border-radius: 10px;
      background: var(--border);
    }

    .sheet h2 {
      margin: 0 0 6px;
      font-size: 21px;
      letter-spacing: -0.5px;
    }

    .sheet-subtitle {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 14px;
    }

    .language-option {
      display: flex;
      width: 100%;
      min-height: 57px;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: right;
    }

    .language-option + .language-option {
      margin-top: 6px;
    }

    .language-option.selected {
      border-color: color-mix(in srgb, var(--accent) 30%, transparent);
      background: var(--accent-soft);
    }

    .language-name {
      flex: 1;
      font-weight: 600;
    }

    .radio-mark {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border: 2px solid #c9ccc8;
      border-radius: 50%;
    }

    .selected .radio-mark {
      border-color: var(--accent);
    }

    .selected .radio-mark::after {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .cancel-button {
      width: 100%;
      height: 48px;
      margin-top: 13px;
      border: 0;
      border-radius: 14px;
      background: color-mix(in srgb, var(--muted) 12%, transparent);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .dialog {
      width: 100%;
      max-width: 410px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
      transform: scale(0.96);
      transition: transform 180ms ease;
    }

    .overlay.dialog-overlay {
      align-items: center;
    }

    .overlay.open .dialog {
      transform: scale(1);
    }

    .dialog h2 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .dialog p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .dialog-actions {
      display: flex;
      gap: 10px;
    }

    .dialog-actions button {
      flex: 1;
      height: 46px;
      border: 0;
      border-radius: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary {
      background: color-mix(in srgb, var(--muted) 12%, transparent);
      color: var(--text);
    }

    .logout-confirm {
      background: var(--danger);
      color: #fff;
    }

    .toast {
      position: fixed;
      z-index: 20;
      bottom: 24px;
      left: 50%;
      padding: 11px 16px;
      border-radius: 12px;
      background: #252925;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: 180ms ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 640px) {
      body {
        padding: 30px;
      }

      .app {
        max-width: 520px;
        min-height: auto;
        margin: 0 auto;
        padding: 0 28px 36px;
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }

      .topbar {
        height: 78px;
      }

      .overlay {
        align-items: center;
      }

      .sheet {
        border-radius: 24px;
        transform: translateY(12px) scale(0.98);
      }

      .overlay.open .sheet {
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M6 8.5A6 6 0 0 1 12 3a6 6 0 0 1 6 5.5c0 4.4-6 10.5-6 10.5S6 12.9 6 8.5Z" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="9" r="2" fill="currentColor"/>
          </svg>
        </span>
        قريب
      </div>
    </header>

    <h1 class="page-title">الإعدادات</h1>

    <section class="profile" aria-label="الملف الشخصي">
      <div class="avatar" role="img" aria-label="صورة عمر الحسن الرمزية"></div>
      <div class="profile-copy">
        <p class="profile-name">عمر الحسن</p>
        <p class="profile-detail">omar.alhassan@example.com</p>
      </div>
      <button class="edit-button" type="button" aria-label="تعديل الملف الشخصي" data-message="تم فتح تعديل الملف الشخصي">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m14.5 5.5 4 4M4 20l3.7-.8L19 7.9a1.8 1.8 0 0 0 0-2.6l-.3-.3a1.8 1.8 0 0 0-2.6 0L4.8 16.3 4 20Z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <section class="section">
      <h2 class="section-title">الحساب</h2>
      <div class="list">
        <button class="row" type="button" data-message="تم فتح العناوين">
          <span class="icon-box" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </span>
          <span class="row-label">العناوين</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="row" type="button" data-message="تم فتح طرق الدفع">
          <span class="icon-box green" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3 10h18M7 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="row-label">طرق الدفع</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">التفضيلات</h2>
      <div class="list">
        <div class="row">
          <span class="icon-box" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM9.5 20h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="row-label">الإشعارات</span>
          <label class="switch" aria-label="تفعيل الإشعارات">
            <input id="notifications" type="checkbox" checked>
            <span class="switch-track"></span>
          </label>
        </div>

        <button class="row" id="languageButton" type="button" aria-haspopup="dialog">
          <span class="icon-box green" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3.5 12h17M12 3c2.2 2.5 3.3 5.5 3.3 9S14.2 18.5 12 21c-2.2-2.5-3.3-5.5-3.3-9S9.8 5.5 12 3Z" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </span>
          <span class="row-label">اللغة</span>
          <span class="row-value" id="languageValue">العربية</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="row">
          <span class="icon-box neutral" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M20.5 14.4A8 8 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="row-label">الوضع الداكن</span>
          <label class="switch" aria-label="تفعيل الوضع الداكن">
            <input id="darkMode" type="checkbox">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">الدعم</h2>
      <div class="list">
        <button class="row" type="button" data-message="تم فتح مركز المساعدة">
          <span class="icon-box green" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
              <path d="M9.7 9a2.4 2.4 0 1 1 3.5 2.1c-.8.4-1.2.9-1.2 1.9M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="row-label">المساعدة</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="row" id="logoutButton" type="button" aria-haspopup="dialog">
          <span class="icon-box danger" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M9 12h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="row-label danger-text">تسجيل الخروج</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <p class="version">قريب · الإصدار 2.4.0</p>
  </main>

  <div class="overlay" id="languageOverlay" role="dialog" aria-modal="true" aria-labelledby="languageTitle">
    <div class="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="languageTitle">اختر اللغة</h2>
      <p class="sheet-subtitle">حدد لغة التطبيق المفضلة لديك.</p>
      <button class="language-option" type="button" data-language="English">
        <span class="language-name" lang="en">English</span>
        <span class="radio-mark" aria-hidden="true"></span>
      </button>
      <button class="language-option selected" type="button" data-language="العربية">
        <span class="language-name" lang="ar">العربية</span>
        <span class="radio-mark" aria-hidden="true"></span>
      </button>
      <button class="cancel-button" type="button" data-close="languageOverlay">إلغاء</button>
    </div>
  </div>

  <div class="overlay dialog-overlay" id="logoutOverlay" role="dialog" aria-modal="true" aria-labelledby="logoutTitle">
    <div class="dialog">
      <h2 id="logoutTitle">تسجيل الخروج؟</h2>
      <p>ستحتاج إلى تسجيل الدخول مرة أخرى للوصول إلى حسابك وتفضيلاتك المحفوظة.</p>
      <div class="dialog-actions">
        <button class="secondary" type="button" data-close="logoutOverlay">إلغاء</button>
        <button class="logout-confirm" id="confirmLogout" type="button">تسجيل الخروج</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const body = document.body;
    const darkMode = document.getElementById("darkMode");
    const notifications = document.getElementById("notifications");
    const languageOverlay = document.getElementById("languageOverlay");
    const logoutOverlay = document.getElementById("logoutOverlay");
    const languageValue = document.getElementById("languageValue");
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function openOverlay(overlay) {
      overlay.classList.add("open");
      const firstButton = overlay.querySelector("button");
      if (firstButton) setTimeout(() => firstButton.focus(), 100);
    }

    function closeOverlay(overlay) {
      overlay.classList.remove("open");
    }

    document.getElementById("languageButton").addEventListener("click", () => {
      openOverlay(languageOverlay);
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
      openOverlay(logoutOverlay);
    });

    document.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", () => {
        closeOverlay(document.getElementById(button.dataset.close));
      });
    });

    document.querySelectorAll(".overlay").forEach(overlay => {
      overlay.addEventListener("click", event => {
        if (event.target === overlay) closeOverlay(overlay);
      });
    });

    document.querySelectorAll(".language-option").forEach(option => {
      option.addEventListener("click", () => {
        document.querySelectorAll(".language-option").forEach(item => {
          item.classList.toggle("selected", item === option);
        });
        languageValue.textContent = option.dataset.language;
        closeOverlay(languageOverlay);
        showToast("تم تحديث تفضيل اللغة");
      });
    });

    darkMode.addEventListener("change", () => {
      body.classList.toggle("dark", darkMode.checked);
      document.querySelector('meta[name="theme-color"]').content =
        darkMode.checked ? "#181b18" : "#f6f5f1";
      showToast(darkMode.checked ? "تم تفعيل الوضع الداكن" : "تم تعطيل الوضع الداكن");
    });

    notifications.addEventListener("change", () => {
      showToast(notifications.checked ? "تم تفعيل الإشعارات" : "تم تعطيل الإشعارات");
    });

    document.querySelectorAll("[data-message]").forEach(button => {
      button.addEventListener("click", () => showToast(button.dataset.message));
    });

    document.getElementById("confirmLogout").addEventListener("click", () => {
      closeOverlay(logoutOverlay);
      showToast("تم تسجيل خروجك");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.querySelectorAll(".overlay.open").forEach(closeOverlay);
      }
    });
  </script>
</body>
</html>

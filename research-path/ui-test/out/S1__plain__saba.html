<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - قارب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1ABCFE;
            --primary-dark: #0F9AD4;
            --text: #1A1A1A;
            --text-light: #5B5B5B;
            --background: #FFFFFF;
            --surface: #FFFFFF;
            --border: #E0E0E0;
            --error: #D32F2F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            direction: rtl;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 16px;
        }

        header {
            padding: 16px 0;
        }

        .back-button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text);
            padding: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-container {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--surface);
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-prefix {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
            pointer-events: none;
        }

        .input-suffix {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 14px;
            pointer-events: none;
        }

        .password-toggle {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin: 16px 0;
        }

        .checkbox-group input[type="checkbox"] {
            margin-left: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms-text {
            font-size: 14px;
            color: var(--text-light);
        }

        .terms-link {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }

        .error-message {
            color: var(--error);
            font-size: 14px;
            margin-top: 6px;
            text-align: left;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .login-link {
            text-align: center;
            margin-top: 32px;
            font-size: 14px;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        @media (min-width: 768px) {
            .container {
                padding: 0 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="back-button" aria-label="العودة">←</button>
        </header>

        <main>
            <h1>إنشاء حساب</h1>

            <form id="signupForm">
                <div class="form-group">
                    <label for="fullName">الاسم الكامل</label>
                    <div class="input-container">
                        <input type="text" id="fullName" name="fullName" placeholder="ادخل اسمك الكامل" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">رقم الموبايل</label>
                    <div class="input-container">
                        <span class="input-prefix">+966</span>
                        <input type="tel" id="mobile" name="mobile" placeholder="5xxxxxxxx" pattern="5\\d{8}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-container">
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-container">
                        <input type="password" id="password" name="password" placeholder="6 أحرف على الأقل" required>
                        <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور">👁</button>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms" class="terms-text">أوافق على <a href="#" class="terms-link">الشروط والأحكام</a></label>
                </div>

                <div id="serverError" class="error-message"></div>

                <button type="submit" class="btn">إنشاء حساب</button>
            </form>

            <div class="login-link">
                لديك حساب بالفعل؟ <a href="#">تسجيل الدخول</a>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.querySelector('.password-toggle');
            const signupForm = document.getElementById('signupForm');
            const serverError = document.getElementById('serverError');
            const backButton = document.querySelector('.back-button');

            // Toggle password visibility
            passwordToggle.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁' : '🔒';
            });

            // Form submission handler
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                serverError.textContent = ''; // Reset error

                // In a real app, send data to server here using fetch();
                console.log('Form submitted');

                // Example of showing an error
                // serverError.textContent = 'هناك خطأ ما. يرجى المحاولة مرة أخرى.';
            });

            // Back button handler
            backButton.addEventListener('click', function() {
                window.history.back();
            });
        });
    </script>

</body>
</html>
